<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>簡単家計簿アプリ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; touch-action: manipulation; }
        .safe-area-top { padding-top: max(0.75rem, env(safe-area-inset-top)); }
        .safe-area-bottom { padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }
    </style>
</head>
<body class="bg-slate-50 h-screen overflow-hidden text-slate-800">

    <div class="max-w-md mx-auto h-screen bg-white shadow-xl flex flex-col justify-between overflow-hidden relative">
        
        <!-- ヘッダー -->
        <header class="bg-indigo-600 text-white px-4 pb-4 rounded-b-2xl shadow-md space-y-3 shrink-0 safe-area-top">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <button id="prevMonthBtn" class="p-1.5 hover:bg-indigo-700 rounded-lg transition text-indigo-200 hover:text-white">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <span id="currentMonthLabel" class="font-bold text-sm tracking-wide">2026年 8月</span>
                    <button id="nextMonthBtn" class="p-1.5 hover:bg-indigo-700 rounded-lg transition text-indigo-200 hover:text-white">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>
                
                <div class="flex items-center gap-1.5">
                    <button id="openFixedBtn" class="bg-indigo-700/80 hover:bg-indigo-700 text-xs px-3 py-1.5 rounded-xl border border-indigo-500/40 transition flex items-center gap-1 font-medium">
                        固定費
                    </button>
                    <button id="resetKeyBtn" class="bg-indigo-800/80 hover:bg-indigo-800 text-[10px] px-2.5 py-1.5 rounded-xl text-indigo-100 transition cursor-pointer" title="新しい専用リンクを発行します">
                        ID確認
                    </button>
                </div>
            </div>

            <!-- サマリーカード -->
            <div class="grid grid-cols-3 gap-2">
                <div class="bg-indigo-700/60 px-2 py-1.5 rounded-xl border border-indigo-500/30 text-center">
                    <p class="text-[10px] text-indigo-200">月間収支</p>
                    <p id="totalBalance" class="text-xs sm:text-sm font-bold truncate">¥0</p>
                </div>
                <div class="bg-indigo-700/60 px-2 py-1.5 rounded-xl border border-indigo-500/30 text-center">
                    <p class="text-[10px] text-emerald-200">収入</p>
                    <p id="totalIncome" class="text-xs sm:text-sm font-bold text-emerald-300 truncate">¥0</p>
                </div>
                <div class="bg-indigo-700/60 px-2 py-1.5 rounded-xl border border-indigo-500/30 text-center">
                    <p class="text-[10px] text-rose-200">支出</p>
                    <p id="totalExpense" class="text-xs sm:text-sm font-bold text-rose-300 truncate">¥0</p>
                </div>
            </div>
        </header>

        <!-- メインコンテンツ -->
        <main class="flex-1 px-4 py-3 overflow-y-auto space-y-3">
            <section class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider">今月の履歴</h3>
                    <span id="syncStatus" class="text-[10px] text-emerald-600 font-semibold">☁️ クラウド接続準備中</span>
                </div>
                <div id="transactionList" class="space-y-2">
                    <!-- 動的生成 -->
                </div>
            </section>
        </main>

        <!-- 操作部 -->
        <footer class="bg-white border-t border-slate-100 px-4 pt-3 pb-6 shadow-lg shrink-0 rounded-t-3xl safe-area-bottom">
            <form id="transactionForm" class="space-y-2.5">
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="typeExpense" class="py-1.5 rounded-xl font-medium text-xs transition bg-rose-500 text-white shadow-sm">支出</button>
                    <button type="button" id="typeIncome" class="py-1.5 rounded-xl font-medium text-xs transition bg-slate-100 text-slate-600">収入</button>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-0.5">金額 (円)</label>
                        <input type="number" id="amount" required placeholder="例: 1500" class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-0.5">カテゴリ</label>
                        <select id="category" class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white text-sm">
                            <!-- 動的 -->
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-0.5">メモ (任意)</label>
                        <input type="text" id="memo" placeholder="例: ランチ" class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-0.5">日付</label>
                        <input type="date" id="date" required class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-xs box-border">
                    </div>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-sm shadow-md transition active:scale-[0.98]">
                    追加する
                </button>
            </form>
        </footer>
    </div>

    <!-- 固定費設定モーダル -->
    <div id="fixedModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4 max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-800">月額固定費の管理</h3>
                <button id="closeFixedModalBtn" class="text-slate-400 hover:text-slate-600 text-lg font-bold">×</button>
            </div>
            <p class="text-xs text-slate-500">毎月の固定費を登録しておくと、ボタン一つで今月の履歴に反映できます。</p>

            <form id="fixedForm" class="space-y-3 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1">名称 / メモ</label>
                        <input type="text" id="fixedMemo" required placeholder="例: 家賃" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1">金額 (円)</label>
                        <input type="number" id="fixedAmount" required placeholder="例: 80000" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1">カテゴリ</label>
                        <select id="fixedCategory" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white">
                            <option value="家賃">家賃</option>
                            <option value="光熱費">光熱費</option>
                            <option value="通信費">通信費</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1">適用日 (毎月何日)</label>
                        <input type="number" id="fixedDay" min="1" max="31" value="1" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white">
                    </div>
                </div>
                <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2 rounded-xl text-sm transition">
                    固定費を追加する
                </button>
            </form>

            <div class="flex-1 overflow-y-auto space-y-2 pr-1" id="fixedList">
                <!-- 動的 -->
            </div>

            <button id="applyFixedBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-sm">
                今月分の固定費を反映する
            </button>
        </div>
    </div>

    <!-- Firebase SDK & 自動同期ロジック -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const categories = {
            expense: ['食費', '日用品', '交通費', '娯楽', '家賃', '光熱費', 'その他'],
            income: ['給与', '副業', 'お小遣い', '一時所得', 'その他']
        };

        let currentType = 'expense';
        let transactions = [];
        let fixedCosts = [];
        let selectedDate = new Date();
        let db = null;
        let auth = null;
        let userId = null;
        let appId = 'default-app-id';

        // ユーザー専用のクラウドキーを自動生成またはURLパラメータから取得
        function getOrCreateUserKey() {
            const urlParams = new URLSearchParams(window.location.search);
            let key = urlParams.get('uid');
            if (!key) {
                key = localStorage.getItem('kakeibo_cloud_uid');
                if (!key) {
                    key = 'user_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                    localStorage.setItem('kakeibo_cloud_uid', key);
                }
                const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?uid=' + key;
                window.history.replaceState({path: newUrl}, '', newUrl);
            } else {
                localStorage.setItem('kakeibo_cloud_uid', key);
            }
            return key;
        }

        // DOMContentLoaded時に確実にイベントをバインド
        document.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('date');
            if (dateInput) dateInput.valueAsDate = new Date();
            updateCategoryOptions();
            renderApp();

            // 各種ボタンのイベント紐付け
            document.getElementById('prevMonthBtn').addEventListener('click', () => changeMonth(-1));
            document.getElementById('nextMonthBtn').addEventListener('click', () => changeMonth(1));
            document.getElementById('openFixedBtn').addEventListener('click', openFixedModal);
            document.getElementById('resetKeyBtn').addEventListener('click', resetCloudKey);
            document.getElementById('closeFixedModalBtn').addEventListener('click', closeFixedModal);
            document.getElementById('applyFixedBtn').addEventListener('click', applyFixedCostsNow);

            document.getElementById('typeExpense').addEventListener('click', () => switchType('expense'));
            document.getElementById('typeIncome').addEventListener('click', () => switchType('income'));

            // 取引フォーム送信
            document.getElementById('transactionForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!db || !userId) {
                    alert("データベース接続の準備中です。しばらくお待ちください。");
                    return;
                }

                const amountVal = document.getElementById('amount').value;
                const amount = parseFloat(amountVal);
                const category = document.getElementById('category').value;
                const memo = document.getElementById('memo').value;
                const date = document.getElementById('date').value;

                if (!amount || isNaN(amount)) return;

                try {
                    await addDoc(collection(db, 'artifacts', appId, 'users', userId, 'transactions'), {
                        type: currentType,
                        amount,
                        category,
                        memo: memo || category,
                        date,
                        createdAt: Date.now()
                    });
                    document.getElementById('amount').value = '';
                    document.getElementById('memo').value = '';
                    document.getElementById('date').valueAsDate = new Date();
                } catch (err) {
                    console.error("Add tx error:", err);
                    alert("データの保存に失敗しました。");
                }
            });

            // 固定費フォーム送信
            document.getElementById('fixedForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!db || !userId) return;

                const memo = document.getElementById('fixedMemo').value;
                const amount = parseFloat(document.getElementById('fixedAmount').value);
                const category = document.getElementById('fixedCategory').value;
                const day = parseInt(document.getElementById('fixedDay').value);

                if (!amount || isNaN(amount)) return;

                try {
                    await addDoc(collection(db, 'artifacts', appId, 'users', userId, 'fixedCosts'), {
                        memo,
                        amount,
                        category,
                        day
                    });
                    document.getElementById('fixedMemo').value = '';
                    document.getElementById('fixedAmount').value = '';
                } catch (err) {
                    console.error("Add fc error:", err);
                }
            });
        });

        function resetCloudKey() {
            const currentUid = localStorage.getItem('kakeibo_cloud_uid') || userId;
            alert(`あなたの専用クラウドID:\n${currentUid}\n\nこのURLをブックマークしておけば、どのスマホやPCからでも同じデータにアクセスできます！`);
        }

        // Firebase初期化 & 匿名認証
        try {
            const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            userId = getOrCreateUserKey();

            async function initAuth() {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (err) {
                    console.error("Auth error:", err);
                }
            }
            initAuth();

            onAuthStateChanged(auth, (user) => {
                if (user && db) {
                    const statusEl = document.getElementById('syncStatus');
                    if (statusEl) statusEl.textContent = "☁️ クラウド自動保存中";
                    setupFirestoreListeners(userId);
                }
            });
        } catch (e) {
            console.error("Firebase init failed:", e);
            const statusEl = document.getElementById('syncStatus');
            if (statusEl) statusEl.textContent = "⚠️ ローカルモード";
        }

        function setupFirestoreListeners(uid) {
            if (!db) return;
            try {
                const txCol = collection(db, 'artifacts', appId, 'users', uid, 'transactions');
                onSnapshot(txCol, (snapshot) => {
                    transactions = [];
                    snapshot.forEach(docSnap => {
                        transactions.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    transactions.sort((a, b) => new Date(b.date) - new Date(a.date) || b.createdAt - a.createdAt);
                    renderApp();
                });

                const fcCol = collection(db, 'artifacts', appId, 'users', uid, 'fixedCosts');
                onSnapshot(fcCol, (snapshot) => {
                    fixedCosts = [];
                    snapshot.forEach(docSnap => {
                        fixedCosts.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    renderFixedList();
                });
            } catch (err) {
                console.error("Firestore listener error:", err);
            }
        }

        function changeMonth(direction) {
            selectedDate.setMonth(selectedDate.getMonth() + direction);
            renderApp();
        }

        function switchType(type) {
            currentType = type;
            const expBtn = document.getElementById('typeExpense');
            const incBtn = document.getElementById('typeIncome');
            
            if (type === 'expense') {
                expBtn.className = "py-1.5 rounded-xl font-medium text-xs transition bg-rose-500 text-white shadow-sm";
                incBtn.className = "py-1.5 rounded-xl font-medium text-xs transition bg-slate-100 text-slate-600";
            } else {
                expBtn.className = "py-1.5 rounded-xl font-medium text-xs transition bg-slate-100 text-slate-600";
                incBtn.className = "py-1.5 rounded-xl font-medium text-xs transition bg-emerald-500 text-white shadow-sm";
            }
            updateCategoryOptions();
        }

        function updateCategoryOptions() {
            const select = document.getElementById('category');
            if (!select) return;
            select.innerHTML = '';
            categories[currentType].forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
        }

        window.deleteTransaction = async function(id) {
            if (!db || !userId) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', userId, 'transactions', id));
            } catch (err) {
                console.error("Delete tx error:", err);
            }
        }

        window.deleteFixedCost = async function(id) {
            if (!db || !userId) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', userId, 'fixedCosts', id));
            } catch (err) {
                console.error("Delete fc error:", err);
            }
        }

        function openFixedModal() {
            const modal = document.getElementById('fixedModal');
            if (modal) modal.classList.remove('hidden');
            renderFixedList();
        }

        function closeFixedModal() {
            const modal = document.getElementById('fixedModal');
            if (modal) modal.classList.add('hidden');
        }

        async function applyFixedCostsNow() {
            if (!db || !userId || fixedCosts.length === 0) {
                alert('固定費が登録されていません。');
                return;
            }

            const year = selectedDate.getFullYear();
            const month = String(selectedDate.getMonth() + 1).padStart(2, '0');
            let addedCount = 0;

            for (const f of fixedCosts) {
                const dayStr = String(f.day).padStart(2, '0');
                const targetDate = `${year}-${month}-${dayStr}`;
                const exists = transactions.some(t => t.date && t.date.startsWith(`${year}-${month}`) && t.memo === f.memo && t.amount === f.amount);

                if (!exists) {
                    await addDoc(collection(db, 'artifacts', appId, 'users', userId, 'transactions'), {
                        type: 'expense',
                        amount: f.amount,
                        category: f.category,
                        memo: f.memo,
                        date: targetDate,
                        createdAt: Date.now()
                    });
                    addedCount++;
                }
            }
            closeFixedModal();
            alert(`${addedCount}件の固定費を現在の月の履歴に反映しました！`);
        }

        function renderFixedList() {
            const listEl = document.getElementById('fixedList');
            if (!listEl) return;
            if (fixedCosts.length === 0) {
                listEl.innerHTML = `<p class="text-center text-slate-400 text-xs py-3">登録されている固定費はありません</p>`;
                return;
            }

            listEl.innerHTML = fixedCosts.map(f => `
                <div class="flex items-center justify-between p-2.5 bg-white rounded-xl border border-slate-100 text-sm">
                    <div>
                        <p class="font-semibold text-slate-800">${escapeHtml(f.memo)} <span class="text-xs font-normal text-slate-400">(${f.category})</span></p>
                        <p class="text-xs text-indigo-600">毎月 ${f.day}日 · ¥${f.amount.toLocaleString()}</p>
                    </div>
                    <button onclick="deleteFixedCost('${f.id}')" class="text-slate-300 hover:text-rose-500 px-2 transition text-sm">×</button>
                </div>
            `).join('');
        }

        function renderApp() {
            const year = selectedDate.getFullYear();
            const month = selectedDate.getMonth() + 1;
            const monthLabel = document.getElementById('currentMonthLabel');
            if (monthLabel) monthLabel.textContent = `${year}年 ${month}月`;

            const prefix = `${year}-${String(month).padStart(2, '0')}`;
            const filtered = transactions.filter(t => t.date && t.date.startsWith(prefix));

            let income = 0;
            let expense = 0;
            filtered.forEach(t => {
                if (t.type === 'income') income += t.amount;
                else expense += t.amount;
            });

            const balEl = document.getElementById('totalBalance');
            const incEl = document.getElementById('totalIncome');
            const expEl = document.getElementById('totalExpense');

            if (balEl) balEl.textContent = `¥${(income - expense).toLocaleString()}`;
            if (incEl) incEl.textContent = `¥${income.toLocaleString()}`;
            if (expEl) expEl.textContent = `¥${expense.toLocaleString()}`;

            const listEl = document.getElementById('transactionList');
            if (!listEl) return;

            if (filtered.length === 0) {
                listEl.innerHTML = `<p class="text-center text-slate-400 text-xs py-6">この月のデータはまだありません</p>`;
                return;
            }

            listEl.innerHTML = filtered.map(t => `
                <div class="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-100 text-sm">
                    <div class="flex items-center gap-2.5">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-xs ${t.type === 'income' ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}">
                            ${t.type === 'income' ? '収' : '支'}
                        </div>
                        <div>
                            <p class="font-semibold text-xs text-slate-800">${escapeHtml(t.memo)}</p>
                            <p class="text-[10px] text-slate-400">${t.date} · ${t.category}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-xs ${t.type === 'income' ? 'text-emerald-600' : 'text-slate-800'}">
                            ${t.type === 'income' ? '+' : '-'}¥${t.amount.toLocaleString()}
                        </span>
                        <button onclick="deleteTransaction('${t.id}')" class="text-slate-300 hover:text-rose-500 transition text-xs px-1">×</button>
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
