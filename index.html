<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minimalist Budget & AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans & Noto Sans JP -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '"Noto Sans JP"', 'sans-serif'],
                    },
                    colors: {
                        stonebg: '#FFFFFF',
                        cardbg: '#FAFAFA',
                        accent: '#2B2623',
                        subtext: '#827A71',
                        line: '#EFECE6',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            background-color: #FFFFFF;
            color: #262320;
            -webkit-tap-highlight-color: transparent;
            word-break: normal;
            overflow-wrap: break-word;
        }
        ::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #EAE5DE;
            border-radius: 3px;
        }
        .ios-shadow {
            box-shadow: 0 -4px 16px -2px rgba(40, 35, 30, 0.04), 0 2px 8px -2px rgba(0, 0, 0, 0.02);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="h-full flex flex-col bg-white selection:bg-stone-200">

    <header class="w-full bg-white pt-4 pb-2.5 px-5 flex items-center justify-between z-10 shrink-0 border-b border-stone-100">
        <div>
            <span class="text-[10px] tracking-widest text-subtext uppercase font-semibold block mb-0.5">HOUSEHOLD BUDGET</span>
            <div class="flex items-center space-x-1.5">
                <h1 id="currentPeriodLabel" class="text-sm font-semibold text-accent tracking-tight whitespace-nowrap">9月25日 〜 10月24日</h1>
                <div class="flex space-x-0.5">
                    <button onclick="changeMonth(-1)" class="p-1 rounded-full hover:bg-stone-100 text-subtext transition-colors" aria-label="前月へ">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                    <button onclick="changeMonth(1)" class="p-1 rounded-full hover:bg-stone-100 text-subtext transition-colors" aria-label="翌月へ">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <!-- 右上ボタン類：AIアドバイスと拡張機能ボタンを同じ幅に揃える -->
            <div class="flex flex-col space-y-1 w-32">
                <button onclick="requestAIAdvice()" class="w-full flex items-center justify-center space-x-1 px-3 py-1 bg-accent text-white text-[11px] font-medium rounded-full shadow-sm hover:bg-stone-700 transition-all shrink-0">
                    <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                    <span>AIアドバイス</span>
                </button>
                <button onclick="openReceiptModal()" class="w-full flex items-center justify-center space-x-1 px-3 py-1 bg-accent text-white text-[11px] font-medium rounded-full shadow-sm hover:bg-stone-700 transition-all shrink-0 text-center">
                    <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    <span>拡張機能</span>
                </button>
            </div>
            <button onclick="toggleSettings()" class="p-1.5 text-subtext hover:text-accent transition-colors rounded-full hover:bg-stone-100 shrink-0 ml-1" aria-label="設定">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto px-4 py-3 pb-36 max-w-md mx-auto w-full flex flex-col space-y-3">
        
        <!-- サマリーカード：枠なし・装飾なし。今月の残高、右側に縦2行（右揃え、枠なし、100万単位対応） -->
        <div class="bg-cardbg rounded-2xl p-3.5 border border-line shadow-2xs shrink-0">
            <div class="flex items-start justify-between">
                <!-- 左側：今月の残高 -->
                <div>
                    <span class="text-[10px] text-subtext font-medium block">今月の残高</span>
                    <div class="flex items-baseline space-x-1.5 mt-0.5">
                        <span id="totalBalance" class="text-xl font-bold tracking-tight text-accent truncate">¥0</span>
                        <span id="budgetStatusText" class="text-[10px] text-emerald-600 font-medium">順調です</span>
                    </div>
                </div>

                <!-- 右側：縦2行スペース（枠なし、右揃え、100万単位対応） -->
                <div class="flex flex-col space-y-2 text-right pl-2">
                    <!-- 1行目：今月収入・支出（枠なし・右揃え） -->
                    <div class="flex items-center justify-end space-x-4">
                        <div>
                            <div class="text-[8px] text-subtext leading-tight">今月収入</div>
                            <div id="totalIncome" class="text-[10px] font-semibold text-accent tracking-tight mt-0.5 truncate">¥0</div>
                        </div>
                        <div>
                            <div class="text-[8px] text-subtext leading-tight">今月支出</div>
                            <div id="totalExpense" class="text-[10px] font-semibold text-accent tracking-tight mt-0.5 truncate">¥0</div>
                        </div>
                    </div>

                    <!-- 2行目：年間収入・年間支出・年間累計（横3グリッド、右揃え、枠なし） -->
                    <div class="grid grid-cols-3 gap-2 text-right">
                        <div>
                            <div class="text-[7px] text-subtext leading-tight">年間収入</div>
                            <div id="yearlyIncome" class="text-[9px] font-semibold text-accent tracking-tight truncate mt-0.5">¥0</div>
                        </div>
                        <div>
                            <div class="text-[7px] text-subtext leading-tight">年間支出</div>
                            <div id="yearlyExpense" class="text-[9px] font-semibold text-accent tracking-tight truncate mt-0.5">¥0</div>
                        </div>
                        <div>
                            <div class="text-[7px] text-subtext leading-tight">年間累計</div>
                            <div id="yearlyBalance" class="text-[9px] font-semibold text-accent tracking-tight truncate mt-0.5">¥0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 予算進捗バー -->
            <div id="budgetProgressContainer" class="mt-2.5 hidden">
                <div class="flex justify-between text-[9px] text-subtext mb-0.5">
                    <span>予算消化率</span>
                    <span id="budgetPercentage">0%</span>
                </div>
                <div class="w-full bg-stone-200/60 h-1 rounded-full overflow-hidden">
                    <div id="budgetProgressBar" class="bg-accent h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="flex flex-col flex-1">
            <div class="flex items-center justify-between mb-2 px-1">
                <h2 class="text-[11px] font-semibold text-accent tracking-wider uppercase">収支履歴</h2>
                <div class="flex space-x-1 bg-stone-100 p-0.5 rounded-lg text-[11px]">
                    <button onclick="setFilter('all')" id="filterAll" class="px-2 py-0.5 rounded-md bg-white text-accent font-medium shadow-2xs transition-all">すべて</button>
                    <button onclick="setFilter('expense')" id="filterExpense" class="px-2 py-0.5 rounded-md text-subtext font-medium transition-all">支出</button>
                    <button onclick="setFilter('income')" id="filterIncome" class="px-2 py-0.5 rounded-md text-subtext font-medium transition-all">収入</button>
                </div>
            </div>

            <!-- リストコンテナ -->
            <div id="transactionList" class="space-y-2">
                <!-- JSにより動的挿入 -->
            </div>
            
            <!-- 空の状態 -->
            <div id="emptyState" class="hidden py-8 text-center">
                <p class="text-[11px] text-subtext">この期間の記録はまだありません</p>
            </div>
        </div>
    </main>

    <div class="fixed bottom-16 left-3 right-3 sm:left-auto sm:right-auto sm:w-full sm:max-w-md sm:translate-x-[-50%] sm:left-[50%] bg-white/95 backdrop-blur-md border border-stone-200/90 rounded-3xl ios-shadow p-3 z-20">
        <form id="transactionForm" onsubmit="handleFormSubmit(event)" class="flex flex-col space-y-2">
            <!-- 収支切替・カテゴリ・日付 -->
            <div class="flex items-center justify-between space-x-2">
                <div class="flex bg-stone-100 p-0.5 rounded-xl text-[11px] shrink-0">
                    <button type="button" onclick="setType('expense')" id="typeExpenseBtn" class="px-2.5 py-1 rounded-lg bg-accent text-white font-medium transition-all">支出</button>
                    <button type="button" onclick="setType('income')" id="typeIncomeBtn" class="px-2.5 py-1 rounded-lg text-subtext font-medium transition-all">収入</button>
                </div>
                <!-- カテゴリ選択 -->
                <select id="categorySelect" class="flex-1 bg-cardbg border border-line rounded-xl px-2.5 py-1.5 text-[11px] text-accent focus:outline-none focus:border-accent">
                    <!-- JSにより動的挿入 -->
                </select>
                <!-- 日付選択 -->
                <input type="date" id="txDate" class="bg-cardbg border border-line rounded-xl px-2 py-1.5 text-[11px] text-accent w-26 focus:outline-none focus:border-accent">
            </div>

            <!-- 金額・メモ・追加ボタン -->
            <div class="flex items-center space-x-2">
                <div class="relative w-26 shrink-0">
                    <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-[11px] text-subtext">¥</span>
                    <input type="number" id="txAmount" placeholder="金額" required min="1" class="w-full bg-cardbg border border-line rounded-xl pl-6 pr-2.5 py-1.5 text-xs font-semibold text-accent focus:outline-none focus:border-accent placeholder:text-stone-300 placeholder:font-normal">
                </div>
                <div class="flex-1">
                    <input type="text" id="txMemo" placeholder="メモ（例：ランチ、スーパーなど）" class="w-full bg-cardbg border border-line rounded-xl px-2.5 py-1.5 text-[11px] text-accent focus:outline-none focus:border-accent placeholder:text-stone-300">
                </div>
                <button type="submit" id="submitBtn" class="bg-accent text-white px-4 py-1.5 rounded-xl text-[11px] font-medium hover:bg-stone-700 transition-all shrink-0 flex items-center justify-center">
                    追加
                </button>
            </div>
        </form>
    </div>

    <!-- 編集ポップアップモーダル -->
    <div id="editModal" class="fixed inset-0 bg-black/30 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cardbg rounded-3xl max-w-sm w-full p-5 border border-line shadow-xl animate-fade-in">
            <div class="flex items-center justify-between pb-2.5 border-b border-stone-100">
                <h3 class="text-xs font-semibold text-accent tracking-tight">収支の編集</h3>
                <button onclick="closeEditModal()" class="text-subtext hover:text-accent p-1" aria-label="閉じる">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <form onsubmit="handleEditSubmit(event)" class="py-3 space-y-2.5">
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-[10px] text-subtext mb-1">収支種別</label>
                    <div class="flex bg-stone-100 p-0.5 rounded-xl text-[11px]">
                        <button type="button" onclick="setEditType('expense')" id="editTypeExpenseBtn" class="flex-1 py-1 rounded-lg bg-accent text-white font-medium transition-all">支出</button>
                        <button type="button" onclick="setEditType('income')" id="editTypeIncomeBtn" class="flex-1 py-1 rounded-lg text-subtext font-medium transition-all">収入</button>
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] text-subtext mb-1">カテゴリ</label>
                    <select id="editCategorySelect" class="w-full bg-stone-50 border border-line rounded-xl px-2.5 py-1.5 text-[11px] text-accent focus:outline-none focus:border-accent">
                        <!-- 動的 -->
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] text-subtext mb-1">金額 (¥)</label>
                    <input type="number" id="editAmount" required min="1" class="w-full bg-stone-50 border border-line rounded-xl px-2.5 py-1.5 text-xs font-semibold text-accent focus:outline-none focus:border-accent">
                </div>
                <div>
                    <label class="block text-[10px] text-subtext mb-1">日付</label>
                    <input type="date" id="editDate" class="w-full bg-stone-50 border border-line rounded-xl px-2.5 py-1.5 text-[11px] text-accent focus:outline-none focus:border-accent">
                </div>
                <div>
                    <label class="block text-[10px] text-subtext mb-1">メモ</label>
                    <input type="text" id="editMemo" class="w-full bg-stone-50 border border-line rounded-xl px-2.5 py-1.5 text-[11px] text-accent focus:outline-none focus:border-accent">
                </div>
                <div class="pt-2.5 border-t border-stone-100 flex justify-end space-x-2">
                    <button type="button" onclick="closeEditModal()" class="px-3.5 py-1.5 bg-stone-100 text-subtext rounded-xl text-[11px] font-medium hover:bg-stone-200 transition-all">キャンセル</button>
                    <button type="submit" class="px-3.5 py-1.5 bg-accent text-white rounded-xl text-[11px] font-medium hover:bg-stone-700 transition-all">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- AIアドバイザーモーダル -->
    <div id="aiModal" class="fixed inset-0 bg-black/30 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cardbg rounded-3xl max-w-md w-full p-5 border border-line shadow-xl animate-fade-in flex flex-col max-h-[85vh]">
            <div class="flex items-center justify-between pb-2.5 border-b border-stone-100">
                <div class="flex items-center space-x-2">
                    <div class="w-6 h-6 rounded-full bg-accent text-white flex items-center justify-center text-[11px] font-semibold">AI</div>
                    <h3 class="text-xs font-semibold text-accent tracking-tight">家計アドバイザー</h3>
                </div>
                <button onclick="closeAIModal()" class="text-subtext hover:text-accent p-1" aria-label="閉じる">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            
            <div id="aiContent" class="py-3 flex-1 overflow-y-auto text-[11px] text-accent leading-relaxed space-y-2.5">
                <!-- AIアドバイス結果 -->
            </div>

            <div class="pt-2.5 border-t border-stone-100 flex justify-end">
                <button onclick="fetchAIAdviceContent()" id="aiRefreshBtn" class="px-3.5 py-1.5 bg-stone-100 text-accent rounded-xl text-[11px] font-medium hover:bg-stone-200 transition-all flex items-center space-x-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    <span>再分析する</span>
                </button>
            </div>
        </div>
    </div>

    <!-- レシート・明細OCR読取モーダル（複数画像・複数レシート対応 ＆ 固定日対応） -->
    <div id="receiptModal" class="fixed inset-0 bg-black/30 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cardbg rounded-3xl max-w-sm w-full p-5 border border-line shadow-xl animate-fade-in flex flex-col max-h-[90vh]">
            <div class="flex items-center justify-between pb-2.5 border-b border-stone-100 shrink-0">
                <div class="flex items-center space-x-2">
                    <div class="w-6 h-6 rounded-full bg-accent text-white flex items-center justify-center text-[11px] font-semibold">OCR</div>
                    <h3 class="text-xs font-semibold text-accent tracking-tight">レシート・明細AI一括読取</h3>
                </div>
                <button onclick="closeReceiptModal()" class="text-subtext hover:text-accent p-1" aria-label="閉じる">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="py-3 space-y-3 overflow-y-auto flex-1 text-[11px]">
                <p class="text-subtext leading-relaxed">複数枚のレシートや、1枚に複数の明細が含まれる画像を一度に選択できます。カードの引き落とし日などで日付を統一したい場合は、下記に日付を指定してください。</p>
                
                <!-- 固定日指定（任意） -->
                <div>
                    <label class="block text-[10px] text-subtext mb-1">一括登録する日付（空欄なら画像内の日付を適用）</label>
                    <input type="date" id="ocrFixedDate" class="w-full bg-white border border-line rounded-xl px-2.5 py-1.5 text-[11px] text-accent focus:outline-none focus:border-accent">
                </div>

                <!-- 撮影・複数選択ボタンエリア -->
                <div class="grid grid-cols-2 gap-2">
                    <label class="flex flex-col items-center justify-center p-3 bg-white border border-dashed border-stone-300 rounded-2xl cursor-pointer hover:bg-stone-50 transition-all text-center">
                        <svg class="w-5 h-5 text-subtext mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        <span class="text-[11px] font-medium text-accent">カメラで撮影</span>
                        <input type="file" accept="image/*" capture="environment" multiple onchange="handleImagesSelected(event)" class="hidden">
                    </label>
                    <label class="flex flex-col items-center justify-center p-3 bg-white border border-dashed border-stone-300 rounded-2xl cursor-pointer hover:bg-stone-50 transition-all text-center">
                        <svg class="w-5 h-5 text-subtext mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        <span class="text-[11px] font-medium text-accent">画像を選択(複数可)</span>
                        <input type="file" accept="image/*" multiple onchange="handleImagesSelected(event)" class="hidden">
                    </label>
                </div>

                <!-- プレビューと解析結果表示エリア -->
                <div id="ocrResultArea" class="hidden space-y-2.5 pt-2 border-t border-stone-100">
                    <div id="ocrPreviewContainer" class="flex space-x-2 overflow-x-auto py-1">
                        <!-- プレビュー画像がここに追加されます -->
                    </div>
                    <div id="ocrStatus" class="text-center py-2 text-subtext">AIが画像を解析中...</div>
                </div>
            </div>
            <div id="ocrActionFooter" class="pt-2.5 border-t border-stone-100 flex justify-end space-x-2 shrink-0 hidden">
                <button type="button" onclick="closeReceiptModal()" class="px-3.5 py-1.5 bg-stone-100 text-subtext rounded-xl text-[11px] font-medium hover:bg-stone-200 transition-all">キャンセル</button>
                <button type="button" onclick="confirmOcrTransactions()" class="px-3.5 py-1.5 bg-accent text-white rounded-xl text-[11px] font-medium hover:bg-stone-700 transition-all">一括登録する</button>
            </div>
        </div>
    </div>

    <!-- 設定モーダル（APIキー設定 ＆ カテゴリ編集・並び替え） -->
    <div id="settingsModal" class="fixed inset-0 bg-black/30 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cardbg rounded-3xl max-w-sm w-full p-5 border border-line shadow-xl animate-fade-in flex flex-col max-h-[90vh]">
            <div class="flex items-center justify-between pb-2.5 border-b border-stone-100 shrink-0">
                <h3 class="text-xs font-semibold text-accent tracking-tight">設定 & タグ管理</h3>
                <button onclick="toggleSettings()" class="text-subtext hover:text-accent p-1" aria-label="閉じる">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="py-3 space-y-4 overflow-y-auto flex-1 text-[11px]">
                <div>
                    <label class="block text-[10px] text-subtext mb-1">今月の目標予算（支出上限）</label>
                    <div class="relative">
                        <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-[11px] text-subtext">¥</span>
                        <input type="number" id="budgetInput" placeholder="例: 120000" class="w-full bg-stone-50 border border-line rounded-xl pl-6 pr-2.5 py-1.5 text-xs text-accent focus:outline-none focus:border-accent">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] text-subtext mb-1">Gemini APIキー</label>
                    <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full bg-stone-50 border border-line rounded-xl px-2.5 py-1.5 text-[11px] text-accent focus:outline-none focus:border-accent">
                </div>

                <!-- 支出カテゴリ編集・並び替え -->
                <div class="pt-2 border-t border-stone-100">
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="text-[10px] font-semibold text-accent">支出タグ（カテゴリ）の編集・並び替え</label>
                    </div>
                    <div id="expenseCategoryList" class="space-y-1.5 mb-2">
                        <!-- 動的生成 -->
                    </div>
                    <div class="flex space-x-1.5">
                        <input type="text" id="newExpenseCat" placeholder="新しい支出タグ" class="flex-1 bg-stone-50 border border-line rounded-xl px-2.5 py-1 text-[11px] text-accent focus:outline-none focus:border-accent">
                        <button type="button" onclick="addCategory('expense')" class="px-3 py-1 bg-accent text-white rounded-xl text-[10px] font-medium hover:bg-stone-700 transition-all">追加</button>
                    </div>
                </div>

                <!-- 収入カテゴリ編集・並び替え -->
                <div class="pt-2 border-t border-stone-100">
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="text-[10px] font-semibold text-accent">収入タグ（カテゴリ）の編集・並び替え</label>
                    </div>
                    <div id="incomeCategoryList" class="space-y-1.5 mb-2">
                        <!-- 動的生成 -->
                    </div>
                    <div class="flex space-x-1.5">
                        <input type="text" id="newIncomeCat" placeholder="新しい収入タグ" class="flex-1 bg-stone-50 border border-line rounded-xl px-2.5 py-1 text-[11px] text-accent focus:outline-none focus:border-accent">
                        <button type="button" onclick="addCategory('income')" class="px-3 py-1 bg-accent text-white rounded-xl text-[10px] font-medium hover:bg-stone-700 transition-all">追加</button>
                    </div>
                </div>
            </div>
            <div class="pt-2.5 border-t border-stone-100 flex justify-end space-x-2 shrink-0">
                <button onclick="saveSettings()" class="px-3.5 py-1.5 bg-accent text-white rounded-xl text-[11px] font-medium hover:bg-stone-700 transition-all">保存する</button>
            </div>
        </div>
    </div>

    <script>
        let defaultCategories = {
            expense: ['食費', '日用品', '住居', '光熱費', '交通費', '交際費', '趣味', '美容', 'その他'],
            income: ['給与', '副業', 'お小遣い', 'その他']
        };

        let categories = JSON.parse(localStorage.getItem('minimal_kakeibo_categories') || JSON.stringify(defaultCategories));

        let currentType = 'expense';
        let currentFilter = 'all';
        let editCurrentType = 'expense';
        let selectedYear = new Date().getFullYear();
        let selectedMonth = new Date().getMonth(); 
        if (new Date().getDate() < 25) {
            selectedMonth -= 1;
            if (selectedMonth < 0) {
                selectedMonth = 11;
                selectedYear -= 1;
            }
        }

        let transactions = JSON.parse(localStorage.getItem('minimal_kakeibo_tx') || '[]');
        let budgets = JSON.parse(localStorage.getItem('minimal_kakeibo_budgets') || '{}');
        let tempOcrParsedTransactions = [];

        window.onload = function() {
            setDefaultDate();
            updateCategoryOptions();
            render();
        };

        function setDefaultDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('txDate').value = today;
        }

        function setType(type) {
            currentType = type;
            const expBtn = document.getElementById('typeExpenseBtn');
            const incBtn = document.getElementById('typeIncomeBtn');
            if (type === 'expense') {
                expBtn.className = "px-2.5 py-1 rounded-lg bg-accent text-white font-medium transition-all";
                incBtn.className = "px-2.5 py-1 rounded-lg text-subtext font-medium transition-all";
            } else {
                incBtn.className = "px-2.5 py-1 rounded-lg bg-accent text-white font-medium transition-all";
                expBtn.className = "px-2.5 py-1 rounded-lg text-subtext font-medium transition-all";
            }
            updateCategoryOptions();
        }

        function setEditType(type) {
            editCurrentType = type;
            const expBtn = document.getElementById('editTypeExpenseBtn');
            const incBtn = document.getElementById('editTypeIncomeBtn');
            if (type === 'expense') {
                expBtn.className = "flex-1 py-1 rounded-lg bg-accent text-white font-medium transition-all";
                incBtn.className = "flex-1 py-1 rounded-lg text-subtext font-medium transition-all";
            } else {
                incBtn.className = "flex-1 py-1 rounded-lg bg-accent text-white font-medium transition-all";
                expBtn.className = "flex-1 py-1 rounded-lg text-subtext font-medium transition-all";
            }
            updateEditCategoryOptions();
        }

        function updateCategoryOptions(selectedCategory = null) {
            const select = document.getElementById('categorySelect');
            select.innerHTML = '';
            const list = categories[currentType] || [];
            list.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                if (selectedCategory && cat === selectedCategory) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            });
        }

        function updateEditCategoryOptions(selectedCategory = null) {
            const select = document.getElementById('editCategorySelect');
            select.innerHTML = '';
            const list = categories[editCurrentType] || [];
            list.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                if (selectedCategory && cat === selectedCategory) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            });
        }

        function changeMonth(direction) {
            selectedMonth += direction;
            if (selectedMonth > 11) {
                selectedMonth = 0;
                selectedYear += 1;
            } else if (selectedMonth < 0) {
                selectedMonth = 11;
                selectedYear -= 1;
            }
            render();
        }

        function getPeriodRange(year, month) {
            const startDate = new Date(year, month, 25);
            let endYear = year;
            let endMonth = month + 1;
            if (endMonth > 11) {
                endMonth = 0;
                endYear += 1;
            }
            const endDate = new Date(endYear, endMonth, 24, 23, 59, 59);
            return { startDate, endDate };
        }

        function formatPeriodLabel(year, month) {
            let startM = month + 1;
            let endM = month + 2;
            if (endM > 12) {
                endM = 1;
            }
            return `${startM}月25日 〜 ${endM}月24日`;
        }

        function getPeriodKey(year, month) {
            return `${year}-${month}`;
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const amountInput = document.getElementById('txAmount');
            const amount = parseFloat(amountInput.value);
            const category = document.getElementById('categorySelect').value;
            const date = document.getElementById('txDate').value;
            const memoInput = document.getElementById('txMemo');
            const memo = memoInput.value.trim() || category;

            if (!amount || isNaN(amount)) return;

            const newTx = {
                id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
                type: currentType,
                amount: amount,
                category: category,
                date: date,
                memo: memo
            };
            transactions.unshift(newTx);
            amountInput.value = '';
            memoInput.value = '';
            setDefaultDate();

            saveTransactions();
            render();
        }

        function openEditModal(id, event) {
            if (event) event.stopPropagation();
            const t = transactions.find(item => item.id === id);
            if (!t) return;

            document.getElementById('editId').value = t.id;
            setEditType(t.type);
            document.getElementById('editAmount').value = t.amount;
            document.getElementById('editDate').value = t.date;
            document.getElementById('editMemo').value = t.memo;
            updateEditCategoryOptions(t.category);

            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function handleEditSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const amount = parseFloat(document.getElementById('editAmount').value);
            const category = document.getElementById('editCategorySelect').value;
            const date = document.getElementById('editDate').value;
            const memo = document.getElementById('editMemo').value.trim() || category;

            if (!amount || isNaN(amount)) return;

            transactions = transactions.map(t => {
                if (t.id === id) {
                    return { ...t, type: editCurrentType, amount: amount, category: category, date: date, memo: memo };
                }
                return t;
            });

            saveTransactions();
            closeEditModal();
            render();
        }

        function deleteTransaction(id, event) {
            event.stopPropagation();
            transactions = transactions.filter(t => t.id !== id);
            saveTransactions();
            render();
        }

        function saveTransactions() {
            localStorage.setItem('minimal_kakeibo_tx', JSON.stringify(transactions));
        }

        function setFilter(filter) {
            currentFilter = filter;
            const allBtn = document.getElementById('filterAll');
            const expBtn = document.getElementById('filterExpense');
            const incBtn = document.getElementById('filterIncome');

            [allBtn, expBtn, incBtn].forEach(btn => {
                btn.className = "px-2 py-0.5 rounded-md text-subtext font-medium transition-all";
            });

            if (filter === 'all') {
                allBtn.className = "px-2 py-0.5 rounded-md bg-white text-accent font-medium shadow-2xs transition-all";
            } else if (filter === 'expense') {
                expBtn.className = "px-2 py-0.5 rounded-md bg-white text-accent font-medium shadow-2xs transition-all";
            } else {
                incBtn.className = "px-2 py-0.5 rounded-md bg-white text-accent font-medium shadow-2xs transition-all";
            }
            renderTransactionList();
        }

        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            const pKey = getPeriodKey(selectedYear, selectedMonth);
            document.getElementById('budgetInput').value = budgets[pKey] || '';
            document.getElementById('apiKeyInput').value = localStorage.getItem('minimal_gemini_api_key') || '';
            
            renderCategorySettingsUI();
            modal.classList.toggle('hidden');
        }

        function renderCategorySettingsUI() {
            ['expense', 'income'].forEach(type => {
                const listEl = document.getElementById(type === 'expense' ? 'expenseCategoryList' : 'incomeCategoryList');
                listEl.innerHTML = '';
                const items = categories[type] || [];
                
                items.forEach((cat, index) => {
                    const row = document.createElement('div');
                    row.className = 'flex items-center space-x-1.5';
                    row.innerHTML = `
                        <input type="text" value="${escapeHtml(cat)}" onchange="updateCategoryName('${type}', ${index}, this.value)" class="flex-1 bg-stone-50 border border-line rounded-xl px-2.5 py-1 text-[11px] text-accent focus:outline-none focus:border-accent">
                        <button type="button" onclick="moveCategory('${type}', ${index}, -1)" class="p-1 text-subtext hover:text-accent rounded hover:bg-stone-200" title="上へ">▲</button>
                        <button type="button" onclick="moveCategory('${type}', ${index}, 1)" class="p-1 text-subtext hover:text-accent rounded hover:bg-stone-200" title="下へ">▼</button>
                        <button type="button" onclick="removeCategoryItem('${type}', ${index})" class="p-1 text-stone-400 hover:text-rose-500 rounded hover:bg-stone-200" title="削除">✕</button>
                    `;
                    listEl.appendChild(row);
                });
            });
        }

        function updateCategoryName(type, index, newName) {
            const trimmed = newName.trim();
            if (!trimmed) return;
            categories[type][index] = trimmed;
        }

        function moveCategory(type, index, direction) {
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= categories[type].length) return;
            const temp = categories[type][index];
            categories[type][index] = categories[type][targetIndex];
            categories[type][targetIndex] = temp;
            renderCategorySettingsUI();
        }

        function removeCategoryItem(type, index) {
            if (categories[type].length <= 1) return;
            categories[type].splice(index, 1);
            renderCategorySettingsUI();
        }

        function addCategory(type) {
            const inputId = type === 'expense' ? 'newExpenseCat' : 'newIncomeCat';
            const inputEl = document.getElementById(inputId);
            const val = inputEl.value.trim();
            if (!val) return;
            if (!categories[type].includes(val)) {
                categories[type].push(val);
                inputEl.value = '';
                renderCategorySettingsUI();
            }
        }

        function saveSettings() {
            const val = parseFloat(document.getElementById('budgetInput').value);
            const pKey = getPeriodKey(selectedYear, selectedMonth);
            if (!isNaN(val) && val > 0) {
                budgets[pKey] = val;
            } else {
                delete budgets[pKey];
            }
            localStorage.setItem('minimal_kakeibo_budgets', JSON.stringify(budgets));

            const apiKeyVal = document.getElementById('apiKeyInput').value.trim();
            if (apiKeyVal) {
                localStorage.setItem('minimal_gemini_api_key', apiKeyVal);
            } else {
                localStorage.removeItem('minimal_gemini_api_key');
            }

            localStorage.setItem('minimal_kakeibo_categories', JSON.stringify(categories));

            toggleSettings();
            updateCategoryOptions();
            renderSummary();
            renderTransactionList();
        }

        function requestAIAdvice() {
            document.getElementById('aiModal').classList.remove('hidden');
            fetchAIAdviceContent();
        }

        function closeAIModal() {
            document.getElementById('aiModal').classList.add('hidden');
        }

        function openReceiptModal() {
            tempOcrParsedTransactions = [];
            document.getElementById('ocrFixedDate').value = '';
            document.getElementById('ocrPreviewContainer').innerHTML = '';
            document.getElementById('ocrResultArea').classList.add('hidden');
            document.getElementById('ocrActionFooter').classList.add('hidden');
            document.getElementById('receiptModal').classList.remove('hidden');
        }

        function closeReceiptModal() {
            document.getElementById('receiptModal').classList.add('hidden');
        }

        async function handleImagesSelected(event) {
            const files = Array.from(event.target.files);
            if (files.length === 0) return;

            const previewContainer = document.getElementById('ocrPreviewContainer');
            previewContainer.innerHTML = '';
            document.getElementById('ocrResultArea').classList.remove('hidden');
            document.getElementById('ocrStatus').textContent = `${files.length}枚の画像をAIが一括解析中...`;
            document.getElementById('ocrActionFooter').classList.add('hidden');

            const apiKey = localStorage.getItem('minimal_gemini_api_key') || "";
            if (!apiKey) {
                document.getElementById('ocrStatus').textContent = 'エラー: 右上の設定からGemini APIキーを設定してください。';
                return;
            }

            const expenseCats = categories.expense.join(', ');
            const incomeCats = categories.income.join(', ');
            const promptText = `これらの画像はレシートやクレジットカード・銀行の利用明細（スクリーンショット等）です。画像に含まれるすべての取引（1枚に複数ある場合や複数枚の画像全体を含む）を完全に抽出してください。
以下のJSONフォーマットの「配列（Array）」のみで正確に回答してください。マークダウンや他の文章は一切含めないでください。
[
  {
    "type": "expense または income",
    "amount": 数値のみ（例: 1480）,
    "category": "以下のカテゴリから最も適切なものを1つ選択 [${expenseCats}, ${incomeCats}]",
    "date": "YYYY-MM-DD形式の日付（不明な場合は本日の日付 ${new Date().toISOString().split('T')[0]}）",
    "memo": "店舗名や明細の内容（例: スーパー、Amazonなど）"
  }
]`;

            const parts = [{ text: promptText }];

            const readerPromises = files.map(file => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const fullData = e.target.result;
                        const base64Data = fullData.split(',')[1];
                        const mimeType = file.type || 'image/jpeg';

                        const img = document.createElement('img');
                        img.src = fullData;
                        img.className = "h-20 w-20 object-cover rounded-xl border border-line shrink-0";
                        previewContainer.appendChild(img);

                        resolve({
                            inlineData: {
                                mimeType: mimeType,
                                data: base64Data
                            }
                        });
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            });

            try {
                const imageParts = await Promise.all(readerPromises);
                imageParts.forEach(p => parts.push(p));

                const payload = {
                    contents: [
                        {
                            role: "user",
                            parts: parts
                        }
                    ]
                };

                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                let response = null;
                for (let attempt = 0; attempt < 3; attempt++) {
                    try {
                        response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (response.ok) break;
                    } catch (err) {
                        if (attempt === 2) throw err;
                        await new Promise(r => setTimeout(r, Math.pow(2, attempt) * 1000));
                    }
                }

                if (!response || !response.ok) {
                    throw new Error('API request failed');
                }

                const result = await response.json();
                const candidate = result.candidates?.[0];
                if (candidate && candidate.content?.parts?.[0]?.text) {
                    let rawText = candidate.content.parts[0].text.trim();
                    if (rawText.startsWith('```json')) {
                        rawText = rawText.replace(/^```json/, '').replace(/```$/, '').trim();
                    } else if (rawText.startsWith('```')) {
                        rawText = rawText.replace(/^```/, '').replace(/```$/, '').trim();
                    }

                    const parsedArray = JSON.parse(rawText);
                    if (!Array.isArray(parsedArray)) {
                        throw new Error('Expected array format');
                    }

                    tempOcrParsedTransactions = parsedArray;

                    let htmlList = `<div class="space-y-1.5 text-left"><div class="text-[10px] font-semibold text-subtext uppercase">解析成功 (${parsedArray.length}件検出)</div>`;
                    parsedArray.forEach((item) => {
                        const isInc = item.type === 'income';
                        htmlList += `
                            <div class="bg-stone-50 p-2 rounded-xl border border-line flex items-center justify-between">
                                <div>
                                    <div class="text-[11px] font-semibold text-accent">${escapeHtml(item.memo || '明細')} (${escapeHtml(item.category)})</div>
                                    <div class="text-[9px] text-subtext">${escapeHtml(item.date)}</div>
                                </div>
                                <div class="text-xs font-bold ${isInc ? 'text-emerald-600' : 'text-accent'}">
                                    ${isInc ? '+' : '-'}¥${Number(item.amount || 0).toLocaleString()}
                                </div>
                            </div>
                        `;
                    });
                    htmlList += `</div>`;

                    document.getElementById('ocrStatus').innerHTML = htmlList;
                    document.getElementById('ocrActionFooter').classList.remove('hidden');
                } else {
                    throw new Error('Invalid response structure');
                }
            } catch (error) {
                document.getElementById('ocrStatus').textContent = '解析に失敗しました。画像が鮮明か、APIキーやプランをご確認ください。';
            }
        }

        function confirmOcrTransactions() {
            if (!tempOcrParsedTransactions || tempOcrParsedTransactions.length === 0) return;

            const fixedDate = document.getElementById('ocrFixedDate').value;

            tempOcrParsedTransactions.forEach(item => {
                const finalDate = fixedDate ? fixedDate : (item.date || new Date().toISOString().split('T')[0]);
                const newTx = {
                    id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
                    type: item.type === 'income' ? 'income' : 'expense',
                    amount: parseFloat(item.amount) || 0,
                    category: item.category || (item.type === 'income' ? categories.income[0] : categories.expense[0]),
                    date: finalDate,
                    memo: item.memo || 'レシート・明細読取'
                };
                transactions.unshift(newTx);
            });

            saveTransactions();
            closeReceiptModal();
            render();
        }

        function render() {
            document.getElementById('currentPeriodLabel').textContent = formatPeriodLabel(selectedYear, selectedMonth);
            renderSummary();
            renderTransactionList();
        }

        function getSortedTransactions() {
            return [...transactions].sort((a, b) => {
                if (b.date !== a.date) {
                    return new Date(b.date) - new Date(a.date);
                }
                return Number(b.id) - Number(b.id);
            });
        }

        function getFilteredTransactionsForCurrentPeriod() {
            const { startDate, endDate } = getPeriodRange(selectedYear, selectedMonth);
            return getSortedTransactions().filter(t => {
                const tDate = new Date(t.date + 'T00:00:00');
                return tDate >= startDate && tDate <= endDate;
            });
        }

        function renderSummary() {
            const periodTxs = getFilteredTransactionsForCurrentPeriod();
            let income = 0;
            let expense = 0;

            periodTxs.forEach(t => {
                const amt = Number(t.amount) || 0;
                if (t.type === 'income') income += amt;
                else expense += amt;
            });

            let yearlyIncome = 0;
            let yearlyExpense = 0;
            const yearStart = new Date(selectedYear, 0, 1);
            const yearEnd = new Date(selectedYear, 11, 31, 23, 59, 59);

            transactions.forEach(t => {
                const tDate = new Date(t.date + 'T00:00:00');
                if (tDate >= yearStart && tDate <= yearEnd) {
                    const amt = Number(t.amount) || 0;
                    if (t.type === 'income') yearlyIncome += amt;
                    else yearlyExpense += amt;
                }
            });

            const yearlyBalance = yearlyIncome - yearlyExpense;
            const balance = income - expense;

            document.getElementById('totalIncome').textContent = '¥' + income.toLocaleString();
            document.getElementById('totalExpense').textContent = '¥' + expense.toLocaleString();
            document.getElementById('yearlyIncome').textContent = '¥' + yearlyIncome.toLocaleString();
            document.getElementById('yearlyExpense').textContent = '¥' + yearlyExpense.toLocaleString();
            
            const yearlyBalanceEl = document.getElementById('yearlyBalance');
            yearlyBalanceEl.textContent = '¥' + yearlyBalance.toLocaleString();
            if (yearlyBalance < 0) {
                yearlyBalanceEl.className = 'text-[9px] font-semibold text-rose-600 tracking-tight truncate mt-0.5';
            } else {
                yearlyBalanceEl.className = 'text-[9px] font-semibold text-accent tracking-tight truncate mt-0.5';
            }
            
            const balanceEl = document.getElementById('totalBalance');
            balanceEl.textContent = '¥' + balance.toLocaleString();
            if (balance < 0) {
                balanceEl.className = 'text-xl font-bold tracking-tight text-rose-600 truncate';
            } else {
                balanceEl.className = 'text-xl font-bold tracking-tight text-accent truncate';
            }

            const pKey = getPeriodKey(selectedYear, selectedMonth);
            const monthBudget = budgets[pKey];
            const progressContainer = document.getElementById('budgetProgressContainer');
            
            if (monthBudget) {
                progressContainer.classList.remove('hidden');
                const percent = Math.min(Math.round((expense / monthBudget) * 100), 100);
                document.getElementById('budgetPercentage').textContent = percent + '%';
                const bar = document.getElementById('budgetProgressBar');
                bar.style.width = percent + '%';
                if (percent >= 90) {
                    bar.className = 'bg-rose-500 h-full rounded-full transition-all duration-500';
                } else {
                    bar.className = 'bg-accent h-full rounded-full transition-all duration-500';
                }
            } else {
                progressContainer.classList.add('hidden');
            }
        }

        function renderTransactionList() {
            const periodTxs = getFilteredTransactionsForCurrentPeriod();
            const listEl = document.getElementById('transactionList');
            const emptyEl = document.getElementById('emptyState');
            listEl.innerHTML = '';

            const filtered = periodTxs.filter(t => {
                if (currentFilter === 'expense') return t.type === 'expense';
                if (currentFilter === 'income') return t.type === 'income';
                return true;
            });

            if (filtered.length === 0) {
                emptyEl.classList.remove('hidden');
                return;
            } else {
                emptyEl.classList.add('hidden');
            }

            filtered.forEach(t => {
                const item = document.createElement('div');
                item.className = 'bg-cardbg rounded-2xl p-3 border border-line flex items-center justify-between shadow-2xs hover:border-stone-300 transition-all';
                
                const isIncome = t.type === 'income';
                const sign = isIncome ? '+' : '-';
                const amountColor = isIncome ? 'text-emerald-600' : 'text-accent';
                const amtNum = Number(t.amount) || 0;

                item.innerHTML = `
                    <div class="flex items-center space-x-2.5 overflow-hidden mr-2">
                        <div class="w-7 h-7 rounded-xl bg-white border border-stone-100 flex items-center justify-center text-[10px] font-medium text-subtext shrink-0 shadow-2xs">
                            ${escapeHtml(t.category.slice(0, 2))}
                        </div>
                        <div class="truncate">
                            <div class="text-[11px] font-semibold text-accent truncate">${escapeHtml(t.memo)}</div>
                            <div class="text-[9px] text-subtext mt-0.5 truncate">${t.date} · <span class="bg-stone-100 px-1 py-0.5 rounded text-stone-600">${escapeHtml(t.category)}</span></div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2 shrink-0">
                        <span class="text-xs font-bold ${amountColor}">${sign}¥${amtNum.toLocaleString()}</span>
                        <div class="flex items-center space-x-1 ml-0.5">
                            <button type="button" onclick="openEditModal('${t.id}', event)" class="text-stone-400 hover:text-stone-600 p-1.5 rounded-lg hover:bg-stone-100 transition-colors" aria-label="編集">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                            </button>
                            <button type="button" onclick="deleteTransaction('${t.id}', event)" class="text-stone-300 hover:text-rose-500 p-1.5 rounded-lg hover:bg-stone-100 transition-colors" aria-label="削除">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </div>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"]/g, function(tag) {
                const chars = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
                return chars[tag] || tag;
            });
        }

        async function fetchAIAdviceContent() {
            const aiContent = document.getElementById('aiContent');
            const aiRefreshBtn = document.getElementById('aiRefreshBtn');
            aiRefreshBtn.disabled = true;
            
            aiContent.innerHTML = `
                <div class="flex flex-col items-center justify-center py-6 space-y-2">
                    <div class="w-5 h-5 border-2 border-stone-300 border-t-accent rounded-full animate-spin"></div>
                    <p class="text-[11px] text-subtext">家計データを丁寧に分析しています...</p>
                </div>
            `;

            const apiKey = localStorage.getItem('minimal_gemini_api_key') || "";
            if (!apiKey) {
                aiContent.innerHTML = `
                    <div class="bg-stone-50 p-3.5 rounded-2xl border border-line text-center space-y-1.5">
                        <p class="text-[11px] text-stone-700 font-medium">Gemini APIキーが設定されていません。</p>
                        <p class="text-[10px] text-subtext">右上の設定アイコンからAPIキーをご入力ください。</p>
                    </div>
                `;
                aiRefreshBtn.disabled = false;
                return;
            }

            const periodTxs = getFilteredTransactionsForCurrentPeriod();
            const pKey = getPeriodKey(selectedYear, selectedMonth);
            const budget = budgets[pKey] || '未設定';

            let totalIncome = 0;
            let totalExpense = 0;
            const categoryMap = {};

            periodTxs.forEach(t => {
                const amt = Number(t.amount) || 0;
                if (t.type === 'income') {
                    totalIncome += amt;
                } else {
                    totalExpense += amt;
                    categoryMap[t.category] = (categoryMap[t.category] || 0) + amt;
                }
            });

            const promptSummary = `
                期間: ${formatPeriodLabel(selectedYear, selectedMonth)}
                総収入: ${totalIncome}円
                総支出: ${totalExpense}円
                月間予算: ${budget}円
                カテゴリ別支出: ${JSON.stringify(categoryMap)}
            `;

            const systemPrompt = "あなたは上品で知的なパーソナルファイナンシャルアドバイザーです。洗練された美しい日本語で、現在の家計データを客観的に分析し、温かみと気品のある節約・貯蓄のアドバイスや改善案を3〜4文程度、簡潔に提案してください。押し付けがましくなく、優しく洗練されたトーンを保ってください。";
            const userQuery = `以下の今月の家計状況を分析してアドバイスをください。\n${promptSummary}`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            try {
                let response = null;
                for (let attempt = 0; attempt < 3; attempt++) {
                    try {
                        response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (response.ok) break;
                    } catch (err) {
                        if (attempt === 2) throw err;
                        await new Promise(r => setTimeout(r, Math.pow(2, attempt) * 1000));
                    }
                }

                if (!response || !response.ok) {
                    throw new Error('API request failed');
                }

                const result = await response.json();
                const candidate = result.candidates?.[0];
                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const adviceText = candidate.content.parts[0].text;
                    aiContent.innerHTML = `
                        <div class="bg-stone-50 p-3.5 rounded-2xl border border-line space-y-1.5">
                            <div class="text-[10px] font-semibold text-subtext uppercase tracking-wider">AI Advisor Report</div>
                            <p class="text-[11px] text-accent leading-relaxed">${escapeHtml(adviceText)}</p>
                        </div>
                    `;
                } else {
                    throw new Error('Invalid response structure');
                }
            } catch (error) {
                aiContent.innerHTML = `
                    <div class="bg-stone-50 p-3.5 rounded-2xl border border-line text-center space-y-1">
                        <p class="text-[11px] text-stone-600 font-medium">アドバイスの生成に失敗しました。</p>
                        <p class="text-[10px] text-subtext">APIキーやネットワーク状況をご確認ください。</p>
                    </div>
                `;
            } finally {
                aiRefreshBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
