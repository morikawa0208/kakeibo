<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minimalist Budget & AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans & Noto Sans JP -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '"Noto Sans JP"', 'sans-serif'],
                    },
                    colors: {
                        stonebg: '#FFFFFF',
                        cardbg: '#FAFAFA',
                        accent: '#2B2623',
                        subtext: '#827A71',
                        line: '#EFECE6',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            background-color: #FFFFFF;
            color: #262320;
            -webkit-tap-highlight-color: transparent;
            word-break: normal;
            overflow-wrap: break-word;
        }
        ::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #EAE5DE;
            border-radius: 3px;
        }
        .ios-shadow {
            box-shadow: 0 -8px 25px -4px rgba(40, 35, 30, 0.05), 0 4px 16px -2px rgba(0, 0, 0, 0.02);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between selection:bg-stone-200">

    <!-- ヘッダーエリア -->
    <header class="w-full bg-white pt-6 pb-3 px-6 flex items-center justify-between z-10 shrink-0 border-b border-stone-100">
        <div>
            <span class="text-[11px] tracking-widest text-subtext uppercase font-semibold block mb-0.5">Household Budget</span>
            <div class="flex items-center space-x-2">
                <h1 id="currentPeriodLabel" class="text-base font-semibold text-accent tracking-tight whitespace-nowrap">2月25日 〜 3月24日</h1>
                <div class="flex space-x-0.5">
                    <button onclick="changeMonth(-1)" class="p-1 rounded-full hover:bg-stone-100 text-subtext transition-colors" aria-label="前月へ">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                    <button onclick="changeMonth(1)" class="p-1 rounded-full hover:bg-stone-100 text-subtext transition-colors" aria-label="翌月へ">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openAIModal()" class="flex items-center space-x-1.5 px-3.5 py-1.5 bg-accent text-white text-xs font-medium rounded-full shadow-sm hover:bg-stone-700 transition-all shrink-0">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                <span>AIアドバイス</span>
            </button>
            <button onclick="toggleSettings()" class="p-2 text-subtext hover:text-accent transition-colors rounded-full hover:bg-stone-100" aria-label="設定">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </button>
        </div>
    </header>

    <!-- メインコンテンツエリア（下部入力バーのために下部に十分な余白を確保） -->
    <main class="flex-1 overflow-y-auto px-5 py-4 pb-48 max-w-md mx-auto w-full flex flex-col space-y-4">
        
        <!-- サマリーカード -->
        <div class="bg-cardbg rounded-3xl p-5 border border-line shadow-2xs relative overflow-hidden">
            <div class="absolute -right-6 -bottom-6 w-28 h-28 bg-stone-100/50 rounded-full pointer-events-none"></div>
            <div class="text-[11px] text-subtext font-medium mb-0.5">今月の残高</div>
            <div class="flex items-baseline space-x-2">
                <span id="totalBalance" class="text-3xl font-bold tracking-tight text-accent">¥0</span>
                <span id="budgetStatusText" class="text-[11px] text-emerald-600 font-medium">順調です</span>
            </div>
            
            <div class="mt-4 grid grid-cols-2 gap-4 pt-3.5 border-t border-stone-200/60">
                <div>
                    <div class="text-[10px] text-subtext tracking-wide">収入</div>
                    <div id="totalIncome" class="text-sm font-semibold text-accent mt-0.5">¥0</div>
                </div>
                <div>
                    <div class="text-[10px] text-subtext tracking-wide">支出</div>
                    <div id="totalExpense" class="text-sm font-semibold text-accent mt-0.5">¥0</div>
                </div>
            </div>

            <!-- 予算進捗バー -->
            <div id="budgetProgressContainer" class="mt-3.5 hidden">
                <div class="flex justify-between text-[10px] text-subtext mb-1">
                    <span>予算消化率</span>
                    <span id="budgetPercentage">0%</span>
                </div>
                <div class="w-full bg-stone-200/60 h-1.5 rounded-full overflow-hidden">
                    <div id="budgetProgressBar" class="bg-accent h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- 履歴とフィルタータブ -->
        <div class="flex flex-col flex-1">
            <div class="flex items-center justify-between mb-2.5 px-1">
                <h2 class="text-xs font-semibold text-accent tracking-wider uppercase">収支履歴</h2>
                <div class="flex space-x-1 bg-stone-100 p-0.5 rounded-lg text-xs">
                    <button onclick="setFilter('all')" id="filterAll" class="px-2.5 py-1 rounded-md bg-white text-accent font-medium shadow-2xs transition-all">すべて</button>
                    <button onclick="setFilter('expense')" id="filterExpense" class="px-2.5 py-1 rounded-md text-subtext font-medium transition-all">支出</button>
                    <button onclick="setFilter('income')" id="filterIncome" class="px-2.5 py-1 rounded-md text-subtext font-medium transition-all">収入</button>
                </div>
            </div>

            <!-- リストコンテナ -->
            <div id="transactionList" class="space-y-2">
                <!-- JSにより動的挿入 -->
            </div>
            
            <!-- 空の状態 -->
            <div id="emptyState" class="hidden py-10 text-center">
                <p class="text-xs text-subtext">この期間の記録はまだありません</p>
            </div>
        </div>
    </main>

    <!-- 画面下部の固定入力バー（位置を少し上に調整） -->
    <div class="fixed bottom-20 left-3 right-3 sm:left-auto sm:right-auto sm:w-full sm:max-w-md sm:translate-x-[-50%] sm:left-[50%] bg-white/95 backdrop-blur-md border border-stone-200/90 rounded-3xl ios-shadow p-3.5 z-20">
        <form id="transactionForm" onsubmit="addTransaction(event)" class="flex flex-col space-y-2.5">
            <!-- 収支切替・カテゴリ・日付 -->
            <div class="flex items-center justify-between space-x-2">
                <div class="flex bg-stone-100 p-0.5 rounded-xl text-xs shrink-0">
                    <button type="button" onclick="setType('expense')" id="typeExpenseBtn" class="px-3 py-1.5 rounded-lg bg-accent text-white font-medium transition-all">支出</button>
                    <button type="button" onclick="setType('income')" id="typeIncomeBtn" class="px-3 py-1.5 rounded-lg text-subtext font-medium transition-all">収入</button>
                </div>
                <!-- カテゴリ選択 -->
                <select id="categorySelect" class="flex-1 bg-cardbg border border-line rounded-xl px-2.5 py-1.5 text-xs text-accent focus:outline-none focus:border-accent">
                    <!-- JSにより動的挿入 -->
                </select>
                <!-- 日付選択 -->
                <input type="date" id="txDate" class="bg-cardbg border border-line rounded-xl px-2 py-1.5 text-xs text-accent w-28 focus:outline-none focus:border-accent">
            </div>

            <!-- 金額・メモ・追加ボタン -->
            <div class="flex items-center space-x-2">
                <div class="relative w-28 shrink-0">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs text-subtext">¥</span>
                    <input type="number" id="txAmount" placeholder="金額" required min="1" class="w-full bg-cardbg border border-line rounded-xl pl-7 pr-3 py-2 text-sm font-semibold text-accent focus:outline-none focus:border-accent placeholder:text-stone-300 placeholder:font-normal">
                </div>
                <div class="flex-1">
                    <input type="text" id="txMemo" placeholder="メモ（例：ランチ、スーパーなど）" class="w-full bg-cardbg border border-line rounded-xl px-3 py-2 text-xs text-accent focus:outline-none focus:border-accent placeholder:text-stone-300">
                </div>
                <button type="submit" class="bg-accent text-white px-4 py-2 rounded-xl text-xs font-medium hover:bg-stone-700 transition-all shrink-0 flex items-center justify-center">
                    追加
                </button>
            </div>
        </form>
    </div>

    <!-- AIアドバイザーモーダル（確認画面なしで即時実行対応） -->
    <div id="aiModal" class="fixed inset-0 bg-black/30 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cardbg rounded-3xl max-w-md w-full p-6 border border-line shadow-xl animate-fade-in flex flex-col max-h-[85vh]">
            <div class="flex items-center justify-between pb-3 border-b border-stone-100">
                <div class="flex items-center space-x-2">
                    <div class="w-7 h-7 rounded-full bg-accent text-white flex items-center justify-center text-xs">AI</div>
                    <h3 class="text-sm font-semibold text-accent tracking-tight">家計アドバイザー</h3>
                </div>
                <button onclick="closeAIModal()" class="text-subtext hover:text-accent p-1" aria-label="閉じる">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            
            <div id="aiContent" class="py-4 flex-1 overflow-y-auto text-xs text-accent leading-relaxed space-y-3">
                <!-- AIアドバイス結果がここに直接表示されます -->
            </div>

            <div class="pt-3 border-t border-stone-100 flex justify-end">
                <button onclick="requestAIAdvice()" id="aiRefreshBtn" class="px-4 py-2 bg-stone-100 text-accent rounded-xl text-xs font-medium hover:bg-stone-200 transition-all flex items-center space-x-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    <span>再分析する</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 設定モーダル（予算 ＆ Gemini APIキー設定） -->
    <div id="settingsModal" class="fixed inset-0 bg-black/30 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cardbg rounded-3xl max-w-sm w-full p-6 border border-line shadow-xl animate-fade-in">
            <div class="flex items-center justify-between pb-3 border-b border-stone-100">
                <h3 class="text-sm font-semibold text-accent tracking-tight">設定</h3>
                <button onclick="toggleSettings()" class="text-subtext hover:text-accent p-1" aria-label="閉じる">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="py-4 space-y-4">
                <div>
                    <label class="block text-[11px] text-subtext mb-1">今月の目標予算（支出上限）</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs text-subtext">¥</span>
                        <input type="number" id="budgetInput" placeholder="例: 120000" class="w-full bg-stone-50 border border-line rounded-xl pl-7 pr-3 py-2 text-sm text-accent focus:outline-none focus:border-accent">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] text-subtext mb-1">Gemini APIキー (GitHub用)</label>
                    <input type="password" id="apiKeyInput" placeholder="AIAIzaSy..." class="w-full bg-stone-50 border border-line rounded-xl px-3 py-2 text-xs text-accent focus:outline-none focus:border-accent">
                    <p class="text-[10px] text-subtext mt-1">※ブラウザのLocalStorageに安全に保存されます。</p>
                </div>
            </div>
            <div class="pt-3 border-t border-stone-100 flex justify-end space-x-2">
                <button onclick="saveSettings()" class="px-4 py-2 bg-accent text-white rounded-xl text-xs font-medium hover:bg-stone-700 transition-all">保存する</button>
            </div>
        </div>
    </div>

    <script>
        // カテゴリ定義
        const categories = {
            expense: ['食費', '日用品', '住居', '光熱費', '交通費', '交際費', '趣味', '美容', 'その他'],
            income: ['給与', '副業', 'お小遣い', 'その他']
        };

        // アプリケーション状態
        let currentType = 'expense';
        let currentFilter = 'all';
        let selectedYear = new Date().getFullYear();
        let selectedMonth = new Date().getMonth(); // 0-11
        if (new Date().getDate() < 25) {
            selectedMonth -= 1;
            if (selectedMonth < 0) {
                selectedMonth = 11;
                selectedYear -= 1;
            }
        }

        // ローカルストレージからの読み込み
        let transactions = JSON.parse(localStorage.getItem('minimal_kakeibo_tx') || '[]');
        let budgets = JSON.parse(localStorage.getItem('minimal_kakeibo_budgets') || '{}');

        window.onload = function() {
            setDefaultDate();
            updateCategoryOptions();
            render();
        };

        function setDefaultDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('txDate').value = today;
        }

        function setType(type) {
            currentType = type;
            const expBtn = document.getElementById('typeExpenseBtn');
            const incBtn = document.getElementById('typeIncomeBtn');
            if (type === 'expense') {
                expBtn.className = "px-3 py-1.5 rounded-lg bg-accent text-white font-medium transition-all";
                incBtn.className = "px-3 py-1.5 rounded-lg text-subtext font-medium transition-all";
            } else {
                incBtn.className = "px-3 py-1.5 rounded-lg bg-accent text-white font-medium transition-all";
                expBtn.className = "px-3 py-1.5 rounded-lg text-subtext font-medium transition-all";
            }
            updateCategoryOptions();
        }

        function updateCategoryOptions() {
            const select = document.getElementById('categorySelect');
            select.innerHTML = '';
            categories[currentType].forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
        }

        function changeMonth(direction) {
            selectedMonth += direction;
            if (selectedMonth > 11) {
                selectedMonth = 0;
                selectedYear += 1;
            } else if (selectedMonth < 0) {
                selectedMonth = 11;
                selectedYear -= 1;
            }
            render();
        }

        function getPeriodRange(year, month) {
            const startDate = new Date(year, month, 25);
            let endYear = year;
            let endMonth = month + 1;
            if (endMonth > 11) {
                endMonth = 0;
                endYear += 1;
            }
            const endDate = new Date(endYear, endMonth, 24, 23, 59, 59);
            return { startDate, endDate };
        }

        function formatPeriodLabel(year, month) {
            let startM = month + 1;
            let endM = month + 2;
            if (endM > 12) {
                endM = 1;
            }
            return `${startM}月25日 〜 ${endM}月24日`;
        }

        function getPeriodKey(year, month) {
            return `${year}-${month}`;
        }

        function addTransaction(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('txAmount').value);
            const category = document.getElementById('categorySelect').value;
            const date = document.getElementById('txDate').value;
            const memo = document.getElementById('txMemo').value || category;

            if (!amount || isNaN(amount)) return;

            const newTx = {
                id: Date.now().toString(),
                type: currentType,
                amount: amount,
                category: category,
                date: date,
                memo: memo
            };

            transactions.unshift(newTx);
            saveTransactions();

            document.getElementById('txAmount').value = '';
            document.getElementById('txMemo').value = '';
            render();
        }

        function deleteTransaction(id) {
            transactions = transactions.filter(t => t.id !== id);
            saveTransactions();
            render();
        }

        function saveTransactions() {
            localStorage.setItem('minimal_kakeibo_tx', JSON.stringify(transactions));
        }

        function setFilter(filter) {
            currentFilter = filter;
            const allBtn = document.getElementById('filterAll');
            const expBtn = document.getElementById('filterExpense');
            const incBtn = document.getElementById('filterIncome');

            [allBtn, expBtn, incBtn].forEach(btn => {
                btn.className = "px-2.5 py-1 rounded-md text-subtext font-medium transition-all";
            });

            if (filter === 'all') {
                allBtn.className = "px-2.5 py-1 rounded-md bg-white text-accent font-medium shadow-2xs transition-all";
            } else if (filter === 'expense') {
                expBtn.className = "px-2.5 py-1 rounded-md bg-white text-accent font-medium shadow-2xs transition-all";
            } else {
                incBtn.className = "px-2.5 py-1 rounded-md bg-white text-accent font-medium shadow-2xs transition-all";
            }
            renderTransactionList();
        }

        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            const pKey = getPeriodKey(selectedYear, selectedMonth);
            document.getElementById('budgetInput').value = budgets[pKey] || '';
            document.getElementById('apiKeyInput').value = localStorage.getItem('minimal_gemini_api_key') || '';
            modal.classList.toggle('hidden');
        }

        function saveSettings() {
            const val = parseFloat(document.getElementById('budgetInput').value);
            const pKey = getPeriodKey(selectedYear, selectedMonth);
            if (!isNaN(val) && val > 0) {
                budgets[pKey] = val;
            } else {
                delete budgets[pKey];
            }
            localStorage.setItem('minimal_kakeibo_budgets', JSON.stringify(budgets));

            const apiKeyVal = document.getElementById('apiKeyInput').value.trim();
            if (apiKeyVal) {
                localStorage.setItem('minimal_gemini_api_key', apiKeyVal);
            } else {
                localStorage.removeItem('minimal_gemini_api_key');
            }

            toggleSettings();
            renderSummary();
        }

        // AIアドバイスボタンを押した瞬間にモーダルを開きつつ、そのまま実行する
        function openAIModal() {
            document.getElementById('aiModal').classList.remove('hidden');
            requestAIAdvice();
        }

        function closeAIModal() {
            document.getElementById('aiModal').classList.add('hidden');
        }

        function render() {
            document.getElementById('currentPeriodLabel').textContent = formatPeriodLabel(selectedYear, selectedMonth);
            renderSummary();
            renderTransactionList();
        }

        function getFilteredTransactionsForCurrentPeriod() {
            const { startDate, endDate } = getPeriodRange(selectedYear, selectedMonth);
            return transactions.filter(t => {
                const tDate = new Date(t.date);
                return tDate >= startDate && tDate <= endDate;
            });
        }

        function renderSummary() {
            const periodTxs = getFilteredTransactionsForCurrentPeriod();
            let income = 0;
            let expense = 0;

            periodTxs.forEach(t => {
                if (t.type === 'income') income += t.amount;
                else expense += t.amount;
            });

            const balance = income - expense;
            document.getElementById('totalIncome').textContent = '¥' + income.toLocaleString();
            document.getElementById('totalExpense').textContent = '¥' + expense.toLocaleString();
            
            const balanceEl = document.getElementById('totalBalance');
            balanceEl.textContent = '¥' + balance.toLocaleString();
            if (balance < 0) {
                balanceEl.className = 'text-3xl font-bold tracking-tight text-rose-600';
            } else {
                balanceEl.className = 'text-3xl font-bold tracking-tight text-accent';
            }

            const pKey = getPeriodKey(selectedYear, selectedMonth);
            const monthBudget = budgets[pKey];
            const progressContainer = document.getElementById('budgetProgressContainer');
            
            if (monthBudget) {
                progressContainer.classList.remove('hidden');
                const percent = Math.min(Math.round((expense / monthBudget) * 100), 100);
                document.getElementById('budgetPercentage').textContent = percent + '%';
                const bar = document.getElementById('budgetProgressBar');
                bar.style.width = percent + '%';
                if (percent >= 90) {
                    bar.className = 'bg-rose-500 h-full rounded-full transition-all duration-500';
                } else {
                    bar.className = 'bg-accent h-full rounded-full transition-all duration-500';
                }
            } else {
                progressContainer.classList.add('hidden');
            }
        }

        function renderTransactionList() {
            const periodTxs = getFilteredTransactionsForCurrentPeriod();
            const listEl = document.getElementById('transactionList');
            const emptyEl = document.getElementById('emptyState');
            listEl.innerHTML = '';

            const filtered = periodTxs.filter(t => {
                if (currentFilter === 'expense') return t.type === 'expense';
                if (currentFilter === 'income') return t.type === 'income';
                return true;
            });

            if (filtered.length === 0) {
                emptyEl.classList.remove('hidden');
                return;
            } else {
                emptyEl.classList.add('hidden');
            }

            filtered.forEach(t => {
                const item = document.createElement('div');
                item.className = 'bg-cardbg rounded-2xl p-3.5 border border-line flex items-center justify-between shadow-2xs hover:border-stone-300 transition-all';
                
                const isIncome = t.type === 'income';
                const sign = isIncome ? '+' : '-';
                const amountColor = isIncome ? 'text-emerald-600' : 'text-accent';

                item.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden mr-2">
                        <div class="w-8 h-8 rounded-xl bg-white border border-stone-100 flex items-center justify-center text-[11px] font-medium text-subtext shrink-0 shadow-2xs">
                            ${t.category.slice(0, 2)}
                        </div>
                        <div class="truncate">
                            <div class="text-xs font-semibold text-accent truncate">${escapeHtml(t.memo)}</div>
                            <div class="text-[10px] text-subtext mt-0.5 truncate">${t.date} · <span class="bg-stone-100 px-1.5 py-0.5 rounded text-stone-600">${t.category}</span></div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2.5 shrink-0">
                        <span class="text-sm font-bold ${amountColor}">${sign}¥${t.amount.toLocaleString()}</span>
                        <button onclick="deleteTransaction('${t.id}')" class="text-stone-300 hover:text-stone-500 p-1 transition-colors" aria-label="削除">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"]/g, function(tag) {
                const chars = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
                return chars[tag] || tag;
            });
        }

        async function requestAIAdvice() {
            const aiContent = document.getElementById('aiContent');
            const aiRefreshBtn = document.getElementById('aiRefreshBtn');
            aiRefreshBtn.disabled = true;
            
            aiContent.innerHTML = `
                <div class="flex flex-col items-center justify-center py-8 space-y-3">
                    <div class="w-6 h-6 border-2 border-stone-300 border-t-accent rounded-full animate-spin"></div>
                    <p class="text-xs text-subtext">家計データを丁寧に分析しています...</p>
                </div>
            `;

            const apiKey = localStorage.getItem('minimal_gemini_api_key') || "";
            if (!apiKey) {
                aiContent.innerHTML = `
                    <div class="bg-stone-50 p-4 rounded-2xl border border-line text-center space-y-2">
                        <p class="text-xs text-stone-700 font-medium">Gemini APIキーが設定されていません。</p>
                        <p class="text-[11px] text-subtext">右上の設定アイコンからAPIキーをご入力ください。</p>
                    </div>
                `;
                aiRefreshBtn.disabled = false;
                return;
            }

            const periodTxs = getFilteredTransactionsForCurrentPeriod();
            const pKey = getPeriodKey(selectedYear, selectedMonth);
            const budget = budgets[pKey] || '未設定';

            let totalIncome = 0;
            let totalExpense = 0;
            const categoryMap = {};

            periodTxs.forEach(t => {
                if (t.type === 'income') {
                    totalIncome += t.amount;
                } else {
                    totalExpense += t.amount;
                    categoryMap[t.category] = (categoryMap[t.category] || 0) + t.amount;
                }
            });

            const promptSummary = `
                期間: ${formatPeriodLabel(selectedYear, selectedMonth)}
                総収入: ${totalIncome}円
                総支出: ${totalExpense}円
                月間予算: ${budget}円
                カテゴリ別支出: ${JSON.stringify(categoryMap)}
            `;

            const systemPrompt = "あなたは上品で知的なパーソナルファイナンシャルアドバイザーです。洗練された美しい日本語で、現在の家計データを客観的に分析し、温かみと気品のある節約・貯蓄のアドバイスや改善案を3〜4文程度、簡潔に提案してください。押し付けがましくなく、優しく洗練されたトーンを保ってください。";
            const userQuery = `以下の今月の家計状況を分析してアドバイスをください。\n${promptSummary}`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            try {
                let response = null;
                for (let attempt = 0; attempt < 3; attempt++) {
                    try {
                        response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (response.ok) break;
                    } catch (err) {
                        if (attempt === 2) throw err;
                        await new Promise(r => setTimeout(r, Math.pow(2, attempt) * 1000));
                    }
                }

                if (!response || !response.ok) {
                    throw new Error('API request failed');
                }

                const result = await response.json();
                const candidate = result.candidates?.[0];
                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const adviceText = candidate.content.parts[0].text;
                    aiContent.innerHTML = `
                        <div class="bg-stone-50 p-4 rounded-2xl border border-line space-y-2">
                            <div class="text-[11px] font-semibold text-subtext uppercase tracking-wider">AI Advisor Report</div>
                            <p class="text-xs text-accent leading-relaxed">${escapeHtml(adviceText)}</p>
                        </div>
                    `;
                } else {
                    throw new Error('Invalid response structure');
                }
            } catch (error) {
                aiContent.innerHTML = `
                    <div class="bg-stone-50 p-4 rounded-2xl border border-line text-center space-y-1">
                        <p class="text-xs text-stone-600 font-medium">アドバイスの生成に失敗しました。</p>
                        <p class="text-[11px] text-subtext">APIキーやネットワーク状況をご確認ください。</p>
                    </div>
                `;
            } finally {
                aiRefreshBtn.disabled = false;
            }
        }
    </script>
</body>
