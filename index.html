<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 minimum-scale=1.0,
                 user-scalable=no,

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
            overscroll-behavior: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;

            width: 100%;
            height: 100%;
            min-height: 100dvh;

            margin: 0;
            padding: 0;

            overflow: hidden;

            touch-action: manipulation;
            overscroll-behavior: none;

            -webkit-text-size-adjust: 100%;
        }

        /*
         * iPhone Safe Area
         */

        .safe-area-top {
            padding-top: max(
                0.75rem,
                calc(env(safe-area-inset-top) + 0.35rem)
            );
        }

        .safe-area-bottom {
            padding-bottom: max(
                1rem,
                calc(env(safe-area-inset-bottom) + 0.5rem)
            );
        }

        /*
         * アプリ全体
         */

        .app-container {
            height: 100vh;
            height: 100dvh;
            max-height: 100dvh;
        }

        /*
         * iPhoneの日付入力が
         * Gridからはみ出す問題対策
         */

        .form-grid > div {
            min-width: 0;
        }

        input,
        select,
        button {
            max-width: 100%;
        }

        input[type="date"] {
            display: block;

            width: 100%;
            min-width: 0;
            max-width: 100%;

            -webkit-appearance: none;
            appearance: none;

            overflow: hidden;
        }

        /*
         * iOSの日付欄内部
         */

        input[type="date"]::-webkit-date-and-time-value {
            text-align: left;
            min-width: 0;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            margin: 0;
            padding: 0;
        }

        /*
         * スクロールバー非表示
         */

        ::-webkit-scrollbar {
            width: 0;
            height: 0;
            background: transparent;
        }

    </style>

</head>

    /* =============================
       家族ID
    ============================== */

    let familyId =
        new URLSearchParams(
            window.location.search
        ).get('uid');



    if (!familyId) {

        familyId =
            'fam_' +
            crypto.randomUUID()
                .replaceAll('-', '')
                .slice(0, 20);


        const newUrl =
            window.location.protocol +

            window.location.pathname +

        window.history.replaceState(
            {},

        );

    /* =============================
       ズーム防止
    ============================== */

    /*
     * Safari ピンチズーム
     */

    document.addEventListener(
        'gesturestart',
        function (event) {

            event.preventDefault();

        },
        {
            passive: false
        }
    );


    document.addEventListener(
        'gesturechange',
        function (event) {

            event.preventDefault();

        },
        {
            passive: false
        }
    );


    document.addEventListener(
        'gestureend',
        function (event) {

            event.preventDefault();

        },
        {
            passive: false
        }
    );



    /*
     * ダブルタップズーム防止
     */

    let lastTouchEnd = 0;


    document.addEventListener(
        'touchend',

        function (event) {

            const now =
                Date.now();


            if (
                now - lastTouchEnd <= 300
            ) {

                event.preventDefault();

            }


            lastTouchEnd =
                now;

        },

        {
            passive: false
        }

    );



    /*
     * ダブルクリックズーム防止
     */

    document.addEventListener(
        'dblclick',

        function (event) {

            event.preventDefault();

        },

        {
            passive: false
        }

    );



    /* =============================
       UIステータス
    ============================== */

    function setStatus(
        text,
        type = 'normal'
    ) {

        const el =
            document.getElementById(
                'syncStatus'
            );


        if (!el) {
            return;
        }


        el.textContent =
            text;


        if (
            type === 'success'
        ) {

            el.className =
                'text-[10px] text-emerald-600 font-semibold text-right';

        }

        else if (
            type === 'error'
        ) {

            el.className =
                'text-[10px] text-rose-600 font-semibold text-right';

        }

        else {

            el.className =
                'text-[10px] text-amber-500 font-semibold text-right';

        }

    }



    function showDebug(error) {

        console.error(
            error
        );


        const area =
            document.getElementById(
                'debugArea'
            );


        if (!area) {
            return;
        }


        area.classList.remove(
            'hidden'
        );


        const code =
            error?.code ||
            'unknown-error';


        const message =
            error?.message ||
            String(error);


        area.innerHTML = `

            <strong>
                Firebaseエラー
            </strong>

            <br>

            code:
            ${escapeHtml(code)}

            <br><br>

            ${escapeHtml(message)}

        `;

    }



    /* =============================
       Firebase開始
    ============================== */

    async function initializeFirebase() {

        try {

            setStatus(
                '🔄 Firebase初期化中...'
            );


            const app =
                initializeApp(
                    firebaseConfig
                );


            auth =
                getAuth(
                    app
                );


            db =
                getFirestore(
                    app
                );



            await setPersistence(
                auth,
                browserLocalPersistence
            );



            setStatus(
                '🔄 匿名認証中...'
            );



            if (
                !auth.currentUser
            ) {

                await signInAnonymously(
                    auth
                );

            }



            onAuthStateChanged(
                auth,

                user => {

                    if (
                        user
                    ) {

                        console.log(
                            'Firebase UID:',
                            user.uid
                        );


                        setStatus(
                            '🔄 Firestore接続中...'
                        );


                        startFirestoreListeners();

                    }

                    else {

                        setStatus(
                            '⚠️ Firebase未認証',
                            'error'
                        );

                    }

                }

            );

        }

        catch (error) {

            setStatus(
                `⚠️ ${error.code || 'Firebaseエラー'}`,
                'error'
            );


            showDebug(
                error
            );

        }

    }



    /* =============================
       Firestoreリアルタイム同期
    ============================== */

    function startFirestoreListeners() {


        if (
            unsubscribeTransactions
        ) {

            unsubscribeTransactions();

        }


        if (
            unsubscribeFixedCosts
        ) {

            unsubscribeFixedCosts();

        }



        try {


            const txColRef =
                collection(
                    db,
                    'artifacts',
                    'github_pages_app',
                    'public',
                    'data',
                    `family_tx_${familyId}`
                );


            const fcColRef =
                collection(
                    db,
                    'artifacts',
                    'github_pages_app',
                    'public',
                    'data',
                    `family_fc_${familyId}`
                );



            unsubscribeTransactions =
                onSnapshot(

                    txColRef,

                    snapshot => {


                        transactions =
                            [];


                        snapshot.forEach(
                            docSnap => {

                                transactions.push({

                                    id:
                                        docSnap.id,

                                    ...docSnap.data()

                                });

                            }
                        );



                        transactions.sort(

                            (a, b) => {

                                const dateDiff =
                                    new Date(
                                        b.date
                                    ) -
                                    new Date(
                                        a.date
                                    );


                                if (
                                    dateDiff !== 0
                                ) {

                                    return dateDiff;

                                }


                                return (
                                    Number(
                                        b.createdAt || 0
                                    )
                                    -
                                    Number(
                                        a.createdAt || 0
                                    )
                                );

                            }

                        );



                        renderApp();


                        setStatus(
                            '☁️ クラウド自動保存中',
                            'success'
                        );

                    },


                    error => {

                        setStatus(
                            `⚠️ Firestore: ${error.code}`,
                            'error'
                        );


                        showDebug(
                            error
                        );

                    }

                );



            unsubscribeFixedCosts =
                onSnapshot(

                    fcColRef,

                    snapshot => {


                        fixedCosts =
                            [];


                        snapshot.forEach(
                            docSnap => {

                                fixedCosts.push({

                                    id:
                                        docSnap.id,

                                    ...docSnap.data()

                                });

                            }
                        );


                        renderFixedList();

                    },


                    error => {

                        showDebug(
                            error
                        );

                    }

                );

        }

        catch (error) {

            setStatus(
                '⚠️ Firestore接続失敗',
                'error'
            );


            showDebug(
                error
            );

        }

    }



    /* =============================
       DOM開始
    ============================== */

    document.addEventListener(
        'DOMContentLoaded',

        () => {


            const dateInput =
                document.getElementById(
                    'date'
                );


            dateInput.valueAsDate =
                new Date();



            updateCategoryOptions();

            renderApp();



            document
                .getElementById(
                    'prevMonthBtn'
                )
                .addEventListener(
                    'click',

                    () => {

                        selectedDate.setMonth(
                            selectedDate.getMonth() - 1
                        );


                        renderApp();

                    }
                );



            document
                .getElementById(
                    'nextMonthBtn'
                )
                .addEventListener(
                    'click',

                    () => {

                        selectedDate.setMonth(
                            selectedDate.getMonth() + 1
                        );


                        renderApp();

                    }
                );



            document
                .getElementById(
                    'typeExpense'
                )
                .addEventListener(
                    'click',

                    () =>
                        switchType(
                            'expense'
                        )
                );



            document
                .getElementById(
                    'typeIncome'
                )
                .addEventListener(
                    'click',

                    () =>
                        switchType(
                            'income'
                        )
                );



            document
                .getElementById(
                    'openFixedBtn'
                )
                .addEventListener(
                    'click',

                    () => {

                        const modal =
                            document.getElementById(
                                'fixedModal'
                            );


                        modal.classList.remove(
                            'hidden'
                        );


                        modal.classList.add(
                            'flex'
                        );


                        renderFixedList();

                    }
                );



            document
                .getElementById(
                    'closeFixedModalBtn'
                )
                .addEventListener(
                    'click',

                    () =>
                        closeFixedModal()
                );



            document
                .getElementById(
                    'shareLinkBtn'
                )
                .addEventListener(
                    'click',

                    async () => {


                        const shareUrl =
                            window.location.href;


                        try {


                            if (
                                navigator.share
                            ) {

                                await navigator.share({

                                    title:
                                        '家計簿',

                                    url:
                                        shareUrl

                                });


                                return;

                            }


                            await navigator
                                .clipboard
                                .writeText(
                                    shareUrl
                                );


                            alert(
                                '共有リンクをコピーしました！'
                            );

                        }

                        catch (error) {


                            if (
                                error?.name ===
                                'AbortError'
                            ) {

                                return;

                            }


                            try {

                                await navigator
                                    .clipboard
                                    .writeText(
                                        shareUrl
                                    );


                                alert(
                                    '共有リンクをコピーしました！'
                                );

                            }

                            catch {

                                prompt(
                                    '以下のURLをコピーしてください',
                                    shareUrl
                                );

                            }

                        }

                    }
                );



            initializeFirebase();

        }

    );



    /* =============================
       支出 / 収入切替
    ============================== */

    function switchType(type) {


        currentType =
            type;


        const expBtn =
            document.getElementById(
                'typeExpense'
            );


        const incBtn =
            document.getElementById(
                'typeIncome'
            );



        if (
            type === 'expense'
        ) {


            expBtn.className =
                "py-1.5 rounded-xl font-medium text-xs transition bg-rose-500 text-white shadow-sm";


            incBtn.className =
                "py-1.5 rounded-xl font-medium text-xs transition bg-slate-100 text-slate-600";

        }

        else {


            expBtn.className =
                "py-1.5 rounded-xl font-medium text-xs transition bg-slate-100 text-slate-600";


            incBtn.className =
                "py-1.5 rounded-xl font-medium text-xs transition bg-emerald-500 text-white shadow-sm";

        }


        updateCategoryOptions();

    }



    /* =============================
       カテゴリ
    ============================== */

    function updateCategoryOptions() {


        const select =
            document.getElementById(
                'category'
            );


        if (!select) {
            return;
        }


        select.innerHTML =
            '';


        categories[
            currentType
        ].forEach(

            cat => {


                const option =
                    document.createElement(
                        'option'
                    );


                option.value =
                    cat;


                option.textContent =
                    cat;


                select.appendChild(
                    option
                );

            }

        );

    }



    /* =============================
       通常取引追加
    ============================== */

    document
        .getElementById(
            'transactionForm'
        )
        .addEventListener(

            'submit',

            async event => {


                event.preventDefault();



                if (
                    !db ||
                    !auth?.currentUser
                ) {

                    alert(
                        'Firebase接続が完了していません。'
                    );

                    return;

                }



                const amount =
                    Number(
                        document
                            .getElementById(
                                'amount'
                            )
                            .value
                    );


                const category =
                    document
                        .getElementById(
                            'category'
                        )
                        .value;


                const memo =
                    document
                        .getElementById(
                            'memo'
                        )
                        .value
                        .trim();


                const date =
                    document
                        .getElementById(
                            'date'
                        )
                        .value;



                if (
                    !Number.isFinite(amount) ||
                    amount <= 0 ||
                    !date
                ) {

                    return;

                }



                try {


                    const txColRef =
                        collection(
                            db,
                            'artifacts',
                            'github_pages_app',
                            'public',
                            'data',
                            `family_tx_${familyId}`
                        );



                    await addDoc(
                        txColRef,
                        {

                            type:
                                currentType,

                            amount,

                            category,

                            memo:
                                memo ||
                                category,

                            date,

                            createdAt:
                                Date.now()

                        }
                    );



                    document
                        .getElementById(
                            'amount'
                        )
                        .value =
                        '';


                    document
                        .getElementById(
                            'memo'
                        )
                        .value =
                        '';


                    document
                        .getElementById(
                            'date'
                        )
                        .valueAsDate =
                        new Date();

                }

                catch (error) {


                    showDebug(
                        error
                    );


                    alert(
                        `保存に失敗しました。\n${error.code || error.message}`
                    );

                }

            }

        );



    /* =============================
       取引削除
    ============================== */

    window.deleteTransaction =
        async function (id) {


            if (
                !db ||
                !auth?.currentUser
            ) {

                return;

            }



            try {


                await deleteDoc(

                    doc(
                        db,
                        'artifacts',
                        'github_pages_app',
                        'public',
                        'data',
                        `family_tx_${familyId}`,
                        id
                    )

                );

            }

            catch (error) {

                showDebug(
                    error
                );

            }

        };



    /* =============================
       固定費追加
    ============================== */

    document
        .getElementById(
            'fixedForm'
        )
        .addEventListener(

            'submit',

            async event => {


                event.preventDefault();


                if (
                    !db ||
                    !auth?.currentUser
                ) {

                    return;

                }



                const memo =
                    document
                        .getElementById(
                            'fixedMemo'
                        )
                        .value
                        .trim();


                const amount =
                    Number(
                        document
                            .getElementById(
                                'fixedAmount'
                            )
                            .value
                    );


                const category =
                    document
                        .getElementById(
                            'fixedCategory'
                        )
                        .value;


                const day =
                    Number(
                        document
                            .getElementById(
                                'fixedDay'
                            )
                            .value
                    );



                if (
                    !memo ||
                    !Number.isFinite(amount) ||
                    amount <= 0 ||
                    !Number.isInteger(day) ||
                    day < 1 ||
                    day > 31
                ) {

                    return;

                }



                try {


                    const fcColRef =
                        collection(
                            db,
                            'artifacts',
                            'github_pages_app',
                            'public',
                            'data',
                            `family_fc_${familyId}`
                        );



                    await addDoc(
                        fcColRef,
                        {

                            memo,

                            amount,

                            category,

                            day

                        }
                    );



                    document
                        .getElementById(
                            'fixedMemo'
                        )
                        .value =
                        '';


                    document
                        .getElementById(
                            'fixedAmount'
                        )
                        .value =
                        '';

                }

                catch (error) {

                    showDebug(
                        error
                    );

                }

            }

        );



    /* =============================
       固定費削除
    ============================== */

    window.deleteFixedCost =
        async function (id) {


            if (
                !db ||
                !auth?.currentUser
            ) {

                return;

            }



            try {


                await deleteDoc(

                    doc(
                        db,
                        'artifacts',
                        'github_pages_app',
                        'public',
                        'data',
                        `family_fc_${familyId}`,
                        id
                    )

                );

            }

            catch (error) {

                showDebug(
                    error
                );

            }

        };



    /* =============================
       固定費反映
    ============================== */

    document
        .getElementById(
            'applyFixedBtn'
        )
        .addEventListener(

            'click',

            async () => {


                if (
                    !db ||
                    !auth?.currentUser
                ) {

                    alert(
                        'Firebase接続が完了していません。'
                    );

                    return;

                }



                if (
                    fixedCosts.length === 0
                ) {

                    alert(
                        '固定費が登録されていません。'
                    );

                    return;

                }



                const year =
                    selectedDate
                        .getFullYear();


                const monthIndex =
                    selectedDate
                        .getMonth();


                const month =
                    String(
                        monthIndex + 1
                    )
                    .padStart(
                        2,
                        '0'
                    );


                const lastDay =
                    new Date(
                        year,
                        monthIndex + 1,
                        0
                    )
                    .getDate();



                let addedCount =
                    0;



                const txColRef =
                    collection(
                        db,
                        'artifacts',
                        'github_pages_app',
                        'public',
                        'data',
                        `family_tx_${familyId}`
                    );



                for (
                    const fixed of
                    fixedCosts
                ) {


                    const actualDay =
                        Math.min(
                            Number(
                                fixed.day
                            ),
                            lastDay
                        );


                    const day =
                        String(
                            actualDay
                        )
                        .padStart(
                            2,
                            '0'
                        );


                    const targetDate =
                        `${year}-${month}-${day}`;



                    const exists =
                        transactions.some(

                            transaction =>

                                transaction.date
                                    ?.startsWith(
                                        `${year}-${month}`
                                    )

                                &&

                                transaction.memo ===
                                    fixed.memo

                                &&

                                Number(
                                    transaction.amount
                                ) ===
                                    Number(
                                        fixed.amount
                                    )

                        );



                    if (
                        exists
                    ) {

                        continue;

                    }



                    try {


                        await addDoc(
                            txColRef,
                            {

                                type:
                                    'expense',

                                amount:
                                    Number(
                                        fixed.amount
                                    ),

                                category:
                                    fixed.category,

                                memo:
                                    fixed.memo,

                                date:
                                    targetDate,

                                createdAt:
                                    Date.now()

                            }
                        );


                        addedCount++;

                    }

                    catch (error) {

                        showDebug(
                            error
                        );

                    }

                }



                closeFixedModal();



                alert(
                    `${addedCount}件の固定費を反映しました！`
                );

            }

        );



    function closeFixedModal() {


        const modal =
            document.getElementById(
                'fixedModal'
            );


        modal.classList.add(
            'hidden'
        );


        modal.classList.remove(
            'flex'
        );

    }



    /* =============================
       メイン描画
    ============================== */

    function renderApp() {


        const year =
            selectedDate
                .getFullYear();


        const month =
            selectedDate
                .getMonth() + 1;



        const monthLabel =
            document.getElementById(
                'currentMonthLabel'
            );


        if (
            monthLabel
        ) {

            monthLabel.textContent =
                `${year}年 ${month}月`;

        }



        const prefix =
            `${year}-${String(month).padStart(2, '0')}`;



        const filtered =
            transactions.filter(

                transaction =>
                    transaction.date &&
                    transaction.date.startsWith(
                        prefix
                    )

            );



        let income =
            0;


        let expense =
            0;



        filtered.forEach(

            transaction => {


                if (
                    transaction.type ===
                    'income'
                ) {

                    income +=
                        Number(
                            transaction.amount
                        );

                }

                else {

                    expense +=
                        Number(
                            transaction.amount
                        );

                }

            }

        );



        document
            .getElementById(
                'totalBalance'
            )
            .textContent =
            `¥${(
                income -
                expense
            ).toLocaleString()}`;



        document
            .getElementById(
                'totalIncome'
            )
            .textContent =
            `¥${income.toLocaleString()}`;



        document
            .getElementById(
                'totalExpense'
            )
            .textContent =
            `¥${expense.toLocaleString()}`;



        const listEl =
            document.getElementById(
                'transactionList'
            );



        if (
            filtered.length === 0
        ) {

            listEl.innerHTML = `

                <p class="
                    text-center
                    text-slate-400
                    text-xs
                    py-6
                ">
                    この月のデータはまだありません
                </p>

            `;


            return;

        }



        listEl.innerHTML =
            filtered.map(

                transaction => `


                    <div
                        class="
                            flex
                            items-center
                            justify-between
                            gap-2
                            p-2.5
                            bg-slate-50
                            rounded-xl
                            border
                            border-slate-100
                            text-sm
                        "
                    >


                        <div
                            class="
                                flex
                                items-center
                                gap-2.5
                                min-w-0
                            "
                        >


                            <div
                                class="
                                    w-8
                                    h-8
                                    rounded-lg
                                    flex
                                    items-center
                                    justify-center
                                    font-bold
                                    text-xs
                                    shrink-0

                                    ${
                                        transaction.type === 'income'
                                            ? 'bg-emerald-100 text-emerald-600'
                                            : 'bg-rose-100 text-rose-600'
                                    }
                                "
                            >

                                ${
                                    transaction.type === 'income'
                                        ? '収'
                                        : '支'
                                }

                            </div>



                            <div class="min-w-0">


                                <p
                                    class="
                                        font-semibold
                                        text-xs
                                        text-slate-800
                                        truncate
                                    "
                                >

                                    ${
                                        escapeHtml(
                                            transaction.memo
                                        )
                                    }

                                </p>



                                <p
                                    class="
                                        text-[10px]
                                        text-slate-400
                                        truncate
                                    "
                                >

                                    ${
                                        escapeHtml(
                                            transaction.date
                                        )
                                    }

                                    ·

                                    ${
                                        escapeHtml(
                                            transaction.category
                                        )
                                    }

                                </p>


                            </div>


                        </div>



                        <div
                            class="
                                flex
                                items-center
                                gap-2
                                shrink-0
                            "
                        >


                            <span
                                class="
                                    font-bold
                                    text-xs

                                    ${
                                        transaction.type === 'income'
                                            ? 'text-emerald-600'
                                            : 'text-slate-800'
                                    }
                                "
                            >

                                ${
                                    transaction.type === 'income'
                                        ? '+'
                                        : '-'
                                }

                                ¥${Number(
                                    transaction.amount
                                ).toLocaleString()}

                            </span>



                            <button
                                type="button"
                                onclick="deleteTransaction('${transaction.id}')"
                                class="
                                    text-slate-300
                                    hover:text-rose-500
                                    transition
                                    text-xs
                                    px-1
                                "
                            >
                                ×
                            </button>


                        </div>


                    </div>


                `

            ).join('');

    }



    /* =============================
       固定費描画
    ============================== */

    function renderFixedList() {


        const listEl =
            document.getElementById(
                'fixedList'
            );


        if (!listEl) {
            return;
        }



        if (
            fixedCosts.length === 0
        ) {

            listEl.innerHTML = `

                <p
                    class="
                        text-center
                        text-slate-400
                        text-xs
                        py-3
                    "
                >
                    登録されている固定費はありません
                </p>

            `;


            return;

        }



        listEl.innerHTML =
            fixedCosts.map(

                fixed => `


                    <div
                        class="
                            flex
                            items-center
                            justify-between
                            gap-2
                            p-2.5
                            bg-white
                            rounded-xl
                            border
                            border-slate-100
                            text-sm
                        "
                    >


                        <div class="min-w-0">


                            <p
                                class="
                                    font-semibold
                                    text-slate-800
                                    truncate
                                "
                            >

                                ${
                                    escapeHtml(
                                        fixed.memo
                                    )
                                }

                                <span
                                    class="
                                        text-xs
                                        font-normal
                                        text-slate-400
                                    "
                                >

                                    (${
                                        escapeHtml(
                                            fixed.category
                                        )
                                    })

                                </span>

                            </p>



                            <p
                                class="
                                    text-xs
                                    text-indigo-600
                                "
                            >

                                毎月
                                ${Number(fixed.day)}
                                日

                                ·

                                ¥${Number(
                                    fixed.amount
                                ).toLocaleString()}

                            </p>


                        </div>



                        <button
                            type="button"
                            onclick="deleteFixedCost('${fixed.id}')"
                            class="
                                text-slate-300
                                hover:text-rose-500
                                px-2
                                transition
                                text-sm
                                shrink-0
                            "
                        >
                            ×
                        </button>


                    </div>


                `

            ).join('');

    }



    /* =============================
       HTML Escape
    ============================== */

    function escapeHtml(value) {


        if (
            value === null ||
            value === undefined
        ) {

            return '';

        }



        return String(value)
            .replace(

                /[&<>'"]/g,

                char => ({

                    '&':
                        '&amp;',

                    '<':
                        '&lt;',

                    '>':
                        '&gt;',

                    "'":
                        '&#39;',

                    '"':
                        '&quot;'

                }[char])

            );

    }


</script>
